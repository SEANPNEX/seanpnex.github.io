name: CI

on:
  pull_request:
    branches:
      - main
    paths-ignore:
      - 'workflow.log'
      - 'README.md'
      - 'LICENSE'
      - '.gitignore'
      - '.github/workflows/commit_log.yml'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build and verify site
        uses: ./.github/actions/build-site
