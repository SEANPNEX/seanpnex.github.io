name: Deploy

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'workflow.log'
      - 'README.md'
      - 'LICENSE'
      - '.gitignore'
      - '.github/workflows/commit_log.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build and verify site
        uses: ./.github/actions/build-site

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./.vitepress/dist
          publish_branch: gh-pages
          force_orphan: true
          commit_message: Deploy VitePress site
