name: Log Commit Details

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'workflow.log'

permissions:
  contents: write

concurrency:
  group: commit-log
  cancel-in-progress: false

jobs:
  log_commit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.actor != 'github-actions[bot]'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Configure Git user
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Log commit information
        env:
          TZ: "America/New_York"
          COMMIT_ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          TIMESTAMP=$(date +"%Y-%m-%d %H:%M:%S")
          MESSAGE=$(git log -1 --pretty=%s)
          printf '%s-%s-%s\n' "$TIMESTAMP" "$COMMIT_ACTOR" "$MESSAGE" >> workflow.log

      - name: Commit and push log file
        run: |
          set -euo pipefail
          git add workflow.log
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore(log): record latest commit [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
