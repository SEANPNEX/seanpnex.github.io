const CARDS = [
  {
    id: "quant-m1-regression-assumptions-2026-10-23",
    topic: "M1 Multiple Regression · Assumptions",
    front: "List the assumptions of the multiple linear regression model.",
    back: `<div class="ans">
<ol>
<li><strong>Linearity</strong>: Y is linear in the coefficients</li>
<li><strong>Homoskedasticity</strong>: constant error variance across observations</li>
<li><strong>Independence of errors</strong>: no serial correlation between residuals</li>
<li><strong>Normality</strong>: errors are normally distributed</li>
<li><strong>Independence of the Xs</strong>: no <strong>perfect</strong> linear relation among the independent variables, and they are not random</li>
</ol>
<p>Note: the assumption rules out only <strong>perfect</strong> multicollinearity. High but imperfect multicollinearity breaks no assumption; it inflates standard errors.</p>
</div>`,
    gap: "left out independence of errors (no serial correlation); the X assumption is no <em>perfect</em> multicollinearity."
  },
  {
    id: "quant-m1-slope-interpretation-2026-10-23",
    topic: "M1 Multiple Regression · Interpreting coefficients",
    front: "How do you interpret a slope coefficient \\(b_j\\), and the intercept \\(b_0\\), in a multiple regression?",
    back: `<div class="ans">
<ul>
<li>\\(b_j\\): the expected change in Y for a one-unit change in \\(X_j\\), <strong>holding all other Xs constant</strong></li>
<li>That is why it is called a <strong>partial</strong> regression (slope) coefficient</li>
<li>\\(b_0\\): the expected value of Y when <strong>all</strong> Xs equal 0</li>
</ul>
</div>`,
    gap: "left out “holding all other Xs constant”, the part that makes it a partial coefficient."
  }
];
