<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Term frequency in analyst reports</title>
  <style>
    :root{--paper:#F0EFEB;--ink:#1C1C1A;--muted:#6A6963;--soft:#B0AFA9;--grid:#D8D6CE}
    *{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,sans-serif}.card{min-height:450px;padding:30px;border-radius:24px;background:var(--paper);overflow:hidden}h2{max-width:760px;margin:0;font-size:clamp(25px,4vw,42px);font-weight:700;line-height:1.05;letter-spacing:-.035em}.sub{margin:10px 0 8px;color:var(--muted);font-size:12px;line-height:1.5}svg{display:block;width:100%;height:315px}.src{margin-top:4px;color:#8A8983;font-size:9px;font-weight:700;letter-spacing:.14em;text-transform:uppercase}.fade{opacity:0;animation:fade .45s cubic-bezier(.25,.9,.35,1) forwards}@keyframes fade{to{opacity:1}}@media(max-width:600px){.card{padding:24px 15px}.sub{font-size:11px}}@media(prefers-reduced-motion:reduce){.fade{opacity:1;animation:none}}
  </style>
  <script src="chart-fx.js"></script>
</head>
<body>
  <main class="card" id="card">
    <h2>Risk language dominates this report sample.</h2>
    <div class="sub">50 illustrative analyst reports · one tick = one occurrence · dot marks every fifth</div>
    <svg id="chart" viewBox="0 0 640 315" role="img" aria-label="Term frequencies in a sample of analyst reports"></svg>
    <div class="src">TICK ROWS · F5 MONO-BASIC · ILLUSTRATIVE CORPUS</div>
  </main>
  <script src="i18n.js"></script>
  <script>
chartI18n.use({
  zh: {
    'Term frequency in analyst reports': '分析师报告中的词频',
    'Risk language dominates this report sample.': '风险相关的措辞在这批报告中占主导。',
    '50 illustrative analyst reports · one tick = one occurrence · dot marks every fifth': '50 份示例分析师报告 · 一道刻度 = 出现一次 · 每第五次加一个点',
    'Term frequencies in a sample of analyst reports': '一批分析师报告中的词频',
    'RISK': '风险',
    'GROWTH': '增长',
    'MARGIN': '利润率',
    'DEMAND': '需求',
    'COST': '成本',
    'GUIDANCE': '业绩指引',
    'RAW FREQUENCY DESCRIBES THE CORPUS · TF–IDF REWEIGHTS EACH DOCUMENT': '原始频率描述整个语料 · TF–IDF 对每篇文档重新加权',
  },
  ja: {
    'Term frequency in analyst reports': 'アナリスト・レポートの単語頻度',
    'Risk language dominates this report sample.': 'このレポート群ではリスクに関する言葉が目立つ。',
    '50 illustrative analyst reports · one tick = one occurrence · dot marks every fifth': 'アナリスト・レポート 50 本の例 · 目盛り 1 本 = 出現 1 回 · 5 回ごとに点',
    'Term frequencies in a sample of analyst reports': 'アナリスト・レポートの標本における単語頻度',
    'RISK': 'リスク',
    'GROWTH': '成長',
    'MARGIN': '利益率',
    'DEMAND': '需要',
    'COST': 'コスト',
    'GUIDANCE': '業績見通し',
    'RAW FREQUENCY DESCRIBES THE CORPUS · TF–IDF REWEIGHTS EACH DOCUMENT': '生の頻度はコーパス全体を表す · TF–IDF は文書ごとに重みを付け直す',
  },
  fr: {
    'Term frequency in analyst reports': 'Fréquence des termes dans des rapports d’analystes',
    'Risk language dominates this report sample.': 'Le vocabulaire du risque domine cet échantillon de rapports.',
    '50 illustrative analyst reports · one tick = one occurrence · dot marks every fifth': '50 rapports d’analystes fictifs · un trait = une occurrence · un point toutes les cinq',
    'Term frequencies in a sample of analyst reports': 'Fréquences des termes dans un échantillon de rapports d’analystes',
    'RISK': 'RISQUE',
    'GROWTH': 'CROISSANCE',
    'MARGIN': 'MARGE',
    'DEMAND': 'DEMANDE',
    'COST': 'COÛT',
    'GUIDANCE': 'PRÉVISIONS',
    'RAW FREQUENCY DESCRIBES THE CORPUS · TF–IDF REWEIGHTS EACH DOCUMENT': 'LA FRÉQUENCE BRUTE DÉCRIT LE CORPUS · LE TF–IDF REPONDÈRE CHAQUE DOCUMENT',
  },
}, {
  patterns: {
    zh: [[/^([A-Z]+): occurrence (\d+) of (\d+)$/, function (t, name, k, n) { return t(name) + '：第 ' + k + ' 次，共 ' + n + ' 次'; }]],
    ja: [[/^([A-Z]+): occurrence (\d+) of (\d+)$/, function (t, name, k, n) { return t(name) + '：' + n + ' 回中 ' + k + ' 回目'; }]],
    fr: [[/^([A-Z]+): occurrence (\d+) of (\d+)$/, function (t, name, k, n) { return t(name) + ' : occurrence ' + k + ' sur ' + n; }]],
  },
});
chartI18n.use({
  zh: {

  },
  ja: {

  },
  fr: {

  },
}, {
  patterns: {
  zh: [
    [/^([−\-+]?[\d][\d,.]*%?)\ occurrences\ ·\ ([−\-+]?[\d][\d,.]*%?)\ of\ the\ ([−\-+]?[\d][\d,.]*%?)\ counted$/, "出现 $1 次 · 占统计的 $3 次中的 $2"],
  ],
  ja: [
    [/^([−\-+]?[\d][\d,.]*%?)\ occurrences\ ·\ ([−\-+]?[\d][\d,.]*%?)\ of\ the\ ([−\-+]?[\d][\d,.]*%?)\ counted$/, "$1 回出現 · 集計した $3 回のうち $2"],
  ],
  fr: [
    [/^([−\-+]?[\d][\d,.]*%?)\ occurrences\ ·\ ([−\-+]?[\d][\d,.]*%?)\ of\ the\ ([−\-+]?[\d][\d,.]*%?)\ counted$/, "$1 occurrences · $2 des $3 comptées"],
  ],
  },
  html: {
  zh: {

  },
  ja: {

  },
  fr: {

  },
  },
});

  </script>
  <script>
    const NS='http://www.w3.org/2000/svg',INK='#1C1C1A',MUTED='#6A6963',GRID='#D8D6CE',PAPER='#F0EFEB';
    const DATA=[['RISK',34],['GROWTH',28],['MARGIN',23],['DEMAND',19],['COST',16],['GUIDANCE',12]];
    const rnd=(a,b)=>{let x=Math.sin(a*127.1+b*311.7)*43758.5453;return x-Math.floor(x)};
    const svg=document.querySelector('#chart');
    function el(tag,attrs={},content='',parent=svg){const n=document.createElementNS(NS,tag);Object.entries(attrs).forEach(([k,v])=>n.setAttribute(k,v));if(content)n.textContent=content;parent.append(n);return n}
    const TOTAL=DATA.reduce((n,[,v])=>n+v,0);
    function render(){
      svg.innerHTML='';const y0=i=>42+i*43,X0=128,PX=10.2;
      DATA.forEach(([name,value],i)=>{
        const y=y0(i),delay=i*.08;
        // One row = one term; hovering anywhere on it reads the count and dims the other rows.
        const row=el('g',{'data-hl':`row${i}`,'data-tip':`${name}\n${value} occurrences · ${Math.round(value/TOTAL*100)}% of the ${TOTAL} counted`});
        el('rect',{x:0,y:y-14,width:X0+34*PX+40,height:36,fill:'transparent'},'',row);
        el('text',{x:115,y:y+3,fill:MUTED,'font-size':10,'font-weight':700,'text-anchor':'end','letter-spacing':'.08em',class:'fade',style:`animation-delay:${delay}s`},name,row);
        el('line',{x1:X0,y1:y+10,x2:X0+34*PX,y2:y+10,stroke:GRID,'stroke-width':.7,class:'fade',style:`animation-delay:${delay}s`},'',row);
        for(let k=0;k<value;k++){
          const x=X0+k*PX+PX/2,height=10+rnd(k+1,i+2)*7;
          el('line',{x1:x,y1:y+10,x2:x,y2:y+10-height,stroke:INK,'stroke-width':1,opacity:.55+rnd(k+3,i+5)*.45,class:'fade',style:`animation-delay:${delay+k*.012}s`},'',row);
          if(k%5===4)el('circle',{cx:x,cy:y+14,r:1,fill:'#C6C5BF',class:'fade',style:`animation-delay:${delay+k*.012}s`},'',row);
        }
        el('text',{x:X0+value*PX+12,y:y+4,fill:INK,'font-size':13,'font-weight':800,class:'fade',style:`animation-delay:${.4+delay}s`},String(value),row);
      });
      el('text',{x:320,y:307,fill:'#B0AFA9','font-size':8,'font-weight':600,'text-anchor':'middle','letter-spacing':'.12em',class:'fade',style:'animation-delay:.9s'},'RAW FREQUENCY DESCRIBES THE CORPUS · TF–IDF REWEIGHTS EACH DOCUMENT');
    }
    render();document.querySelector('#card').addEventListener('click',render);
  </script>
</body>
</html>
