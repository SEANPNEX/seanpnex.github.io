<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Smaller α bends the production curve sooner</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="curve-kit.js"></script>
  <script src="chart-fx.js"></script>
</head>
<body>
  <main class="card" id="card">
    <h2>Smaller α bends the production curve sooner.</h2>
    <div class="sub" id="sub"></div>
    <div class="grid">
      <section class="panel">
        <h3>Production function</h3>
        <div class="hint">Ink = α = 0.3 (more concave) · gray = α = 0.7 (flatter bend)</div>
        <svg id="prod" role="img" aria-label="Production function"></svg>
      </section>
      <section class="panel">
        <h3>Marginal product of capital</h3>
        <div class="hint" id="hint-mpk"></div>
        <svg id="mpk" role="img" aria-label="Marginal product of capital"></svg>
      </section>
    </div>
    <div class="src" id="src"></div>
  </main>
  <script src="i18n.js"></script>
  <script>
chartI18n.use({
  zh: {
    'Smaller α bends the production curve sooner': '更小的 α 让生产曲线更早弯曲',
    'Smaller α bends the production curve sooner.': '更小的 α 让生产曲线更早弯曲。',
    'y = A kα · A = 1 · α = 0.3 vs α = 0.7 · same k range': 'y = A kα · A = 1 · α = 0.3 对 α = 0.7 · 相同 k 区间',
    'Production function': '生产函数',
    'Ink = α = 0.3 (more concave) · gray = α = 0.7 (flatter bend)': '墨色 = α = 0.3（更凹）· 灰色 = α = 0.7（弯曲更缓）',
    'Marginal product of capital': '资本的边际产出',
    'MPK = α A kα−1 · smaller α falls faster': 'MPK = α A kα−1 · 更小的 α 下降更快',
    'SMALLER α · STRONGER DMP · F2 HAIRLINE LINE · y = A kα': '更小 α · 更强边际递减 · F2 发丝折线 · y = A kα',
    'capital intensity k →': '资本强度 k →',
    'output y': '产出 y',
    'MPK': 'MPK',
    'α = 0.3': 'α = 0.3',
    'α = 0.7': 'α = 0.7',
    'bends sooner': '更早弯曲',
  },
  ja: {
    'Smaller α bends the production curve sooner': '小さい α ほど生産曲線は早く曲がる',
    'Smaller α bends the production curve sooner.': '小さい α ほど生産曲線は早く曲がる。',
    'y = A kα · A = 1 · α = 0.3 vs α = 0.7 · same k range': 'y = A kα · A = 1 · α = 0.3 対 α = 0.7 · 同じ k 範囲',
    'Production function': '生産関数',
    'Ink = α = 0.3 (more concave) · gray = α = 0.7 (flatter bend)': '墨 = α = 0.3（より凹）· 灰 = α = 0.7（曲がりが緩い）',
    'Marginal product of capital': '資本の限界生産性',
    'MPK = α A kα−1 · smaller α falls faster': 'MPK = α A kα−1 · 小さい α ほど速く低下',
    'SMALLER α · STRONGER DMP · F2 HAIRLINE LINE · y = A kα': '小さい α · 強い逓減 · F2 ヘアライン · y = A kα',
    'capital intensity k →': '資本集約度 k →',
    'output y': '産出 y',
    'MPK': 'MPK',
    'α = 0.3': 'α = 0.3',
    'α = 0.7': 'α = 0.7',

  },
  fr: {
    'Smaller α bends the production curve sooner': 'Un α plus petit courbe la production plus tôt',
    'Smaller α bends the production curve sooner.': 'Un α plus petit courbe la production plus tôt.',
    'y = A kα · A = 1 · α = 0.3 vs α = 0.7 · same k range': 'y = A kα · A = 1 · α = 0,3 vs α = 0,7 · même plage de k',

    'capital intensity k →': 'intensité capitalistique k →',
    'output y': 'produit y',

  <script>
(() => {
  const { C, T, label, frame, axes, curve, beads, probe, mount, html } = curveKit;
  const LO = 0.3, HI = 0.7, K = 8;
  const yOf = (a) => (k) => Math.pow(k, a);
  const mpkOf = (a) => (k) => a * Math.pow(k, a - 1);
  const height = (w) => Math.max(190, Math.min(240, w * 0.8));
  const M = { l: 14, r: 12, t: 30, b: 28 };

  html('#sub', 'y = A kα · A = 1 · α = 0.3 vs α = 0.7 · same k range', [['kα', 'k<sup>α</sup>']]);
  html('#hint-mpk', 'MPK = α A kα−1 · smaller α falls faster', [['kα−1', 'k<sup>α−1</sup>']]);
  html('#src', 'SMALLER α · STRONGER DMP · F2 HAIRLINE LINE · y = A kα', [['y = A kα', '<span class="f">y = A k<sup>α</sup></span>']]);

  // Each curve is named at its right end, just above the line.
  const ends = (s, F, f, delay) => {
    label(s, F.X1, F.y(f(HI)(K)) - 8, T('α = 0.7'), { fill: C.MUTED, anchor: 'end', delay });
    label(s, F.X1, F.y(f(LO)(K)) - 8, T('α = 0.3'), { anchor: 'end', delay: delay + 0.1 });
  };

  mount(document.getElementById('prod'), (s, W, H) => {
    const F = frame(s, W, H, M, K, yOf(HI)(K) * 1.12);
    axes(s, F, T('capital intensity k →'), T('output y'));
    curve(s, F, yOf(HI), 0, K, { stroke: C.SOFT, width: 1.3 });
    curve(s, F, yOf(LO), 0, K, { delay: 0.08 });
    beads(s, F, yOf(HI), 0.3, K, { fill: C.SOFT, r: 1.4 });
    beads(s, F, yOf(LO), 0.3, K);
    ends(s, F, yOf, 0.75);
    // The knee of the α = 0.3 curve: most of its rise is already used up by k ≈ 2.
    label(s, F.x(1.6), F.y(yOf(LO)(1.6)) + 18, T('bends sooner'), { size: 10.5, fill: C.MUTED, weight: 700, maxWidth: F.X1 - F.x(1.6) - 4, delay: 0.95 });
    probe(s, F, [{ name: 'y (α = 0.3)', f: yOf(LO) }, { name: 'y (α = 0.7)', f: yOf(HI), stroke: C.SOFT }]);
  }, height);

  mount(document.getElementById('mpk'), (s, W, H) => {
    const F = frame(s, W, H, M, K, 1);
    axes(s, F, T('capital intensity k →'), T('MPK'));
    curve(s, F, mpkOf(HI), 0.2, K, { stroke: C.SOFT, width: 1.3 });
    curve(s, F, mpkOf(LO), 0.1, K, { delay: 0.08 });
    beads(s, F, mpkOf(HI), 0.5, K, { fill: C.SOFT, r: 1.4 });
    beads(s, F, mpkOf(LO), 0.5, K);
    ends(s, F, mpkOf, 0.7);
    probe(s, F, [{ name: 'MPK (α = 0.3)', f: mpkOf(LO), from: 0.1 }, { name: 'MPK (α = 0.7)', f: mpkOf(HI), from: 0.2, stroke: C.SOFT }]);
  }, height);
})();
  </script>
</body>
</html>
