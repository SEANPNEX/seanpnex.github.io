  <script>
  const NS='http://www.w3.org/2000/svg', PAPER='#F0EFEB',INK='#1C1C1A',G1='#4A4944',G2='#6A6963',G3='#8A8983',G4='#A8A7A0',G5='#B0AFA9',G6='#C6C5BF',GRID='#D8D6CE',FAINT='#E3E2DB';
  const rnd=(a,b)=>{let x=Math.sin(a*127.1+b*311.7)*43758.5453;return x-Math.floor(x)};
  const T=(s)=>(window.chartI18n?chartI18n.t(s):s);

  function defs(){const d=el('defs'),m=document.createElementNS(NS,'marker');m.setAttribute('id','arrow');m.setAttribute('viewBox','0 0 10 10');m.setAttribute('refX','8');m.setAttribute('refY','5');m.setAttribute('markerWidth','6');m.setAttribute('markerHeight','6');m.setAttribute('orient','auto-start-reverse');const p=document.createElementNS(NS,'path');p.setAttribute('d','M 0 0 L 10 5 L 0 10 z');p.setAttribute('fill',G4);m.append(p);d.append(m)}

    svm:{title:'The widest safe street defines the classifier.',sub:'two classes · solid line = decision boundary · dashed lines = margins · circled points = support vectors',src:'PLUMB SCATTER · F8 MONO-BASIC · ILLUSTRATIVE DATA',render(){
      const pts=[];for(let i=0;i<14;i++)pts.push([125+rnd(i,2)*210,65+rnd(i,5)*105,'+']);for(let i=0;i<14;i++)pts.push([465+rnd(i,7)*210,150+rnd(i,9)*105,'−']);

      pts.forEach(([x,y,c],i)=>{line(x,270,x,y,{stroke:FAINT,'stroke-width':.55,style:`animation-delay:${.25+i*.018}s`});dot(x,y,4,{fill:c==='+'?INK:PAPER,stroke:INK,'stroke-width':1.4,style:`animation-delay:${.3+i*.018}s`,'data-hl':c==='+'?'pos':'neg','data-tip':`Class ${c} · observation ${i%14+1}\nfeature 1 at ${Math.round((x-55)/6.9)} of 100`});text(x,y+3,c,{fill:c==='+'?PAPER:INK,'text-anchor':'middle','font-size':8,class:'fade',style:`animation-delay:${.45+i*.018}s`})});

    }},
    cart:{title:'Every split narrows the decision.',sub:'binary classification tree · terminal leaves return the majority class',src:'TREE LR · G7 MONO · DIVIDEND-CLASSIFICATION EXAMPLE',render(){
      const nodes=[[400,35,190,44,'FCF growth > 4%?'],[255,130,175,44,'No increase'],[545,130,200,44,'Interest coverage > 3×?'],[455,230,175,44,'No increase'],[650,230,175,44,'Increase']];
      const tips=['Root split\nNo → no increase · Yes → test interest coverage','Leaf\nfirms without FCF growth above 4%','Second split\nonly firms with FCF growth above 4% reach it','Leaf\ngrowth, but interest coverage of 3× or less','Leaf\ngrowth and coverage above 3×: the dividend rises'];
      [[400,79,255,130,0,1],[400,79,545,130,0,2],[545,174,455,230,2,3],[545,174,650,230,2,4]].forEach(([a,b,c,d,f,t],i)=>arrow(a,b,c,d,i*.12,{'data-edge':`n${f}>n${t}`}));nodes.forEach((n,i)=>labelBox(n[0]-n[2]/2,n[1],n[2],n[3],n[4],i===4,{'data-node':`n${i}`,'data-tip':`${T(n[4])}\n${tips[i].split('\n')[1]}`}));text(303,102,'NO',{'font-size':8});text(487,102,'YES',{'font-size':8});text(486,207,'NO',{'font-size':8});text(605,207,'YES',{'font-size':8});
    }},
    pca:{title:'Correlated features converge into orthogonal directions.',sub:'lines = feature loadings · larger hubs = more variance explained',src:'RADIAL CONVERGENCE · L5 MONO-EDITORIAL · PCA CONCEPT',render(){
      const feats=['P/E','P/B','E/P','ROE','MARGIN','GROWTH','LEVERAGE','YIELD'], hubs=[[390,115,'PC 1 · 52%',28],[515,205,'PC 2 · 24%',19],[275,220,'PC 3 · 11%',13]];
      const hubOf=(i)=>i<4?0:i<7?1:2;
      feats.forEach((f,i)=>{const a=-155+i*310/(feats.length-1),x=400+330*Math.cos(a*Math.PI/180),y=160+125*Math.sin(a*Math.PI/180),h=hubOf(i);const [hx,hy,hs]=hubs[h];const hover={'data-hl':`f${i}`,'data-tip':`${f}\nloads mainly on ${hs.split(' · ')[0]}`};el('path',{d:`M${x} ${y} Q400 160 ${hx} ${hy}`,fill:'none',stroke:G5,'stroke-width':.8,pathLength:1,class:'draw',style:`animation-delay:${i*.07}s`,...hover});dot(x,y,3,{fill:G2,style:`animation-delay:${i*.07}s`,...hover});text(x,y+(y<160?-9:15),f,{'text-anchor':'middle','font-size':8,class:'fade',...hover})});hubs.forEach(([x,y,s,r],i)=>{const mine=feats.map((f,k)=>hubOf(k)===i?k:-1).filter((k)=>k>=0);dot(x,y,r,{style:`animation-delay:${.45+i*.12}s`,'data-hl':mine.map((k)=>`f${k}`).join(' '),'data-tip':`${s.replace(' · ',' explains ')} of the variance\n${mine.map((k)=>feats[k]).join(', ')}`});text(x,y+4,s,{fill:PAPER,'text-anchor':'middle','font-size':9,'font-weight':800,class:'fade',style:`animation-delay:${.55+i*.12}s`})});
    }},
    autoencoder:{title:'Compression succeeds only if the decoder can rebuild the input.',sub:'encoder → bottleneck → decoder · training minimizes reconstruction error ‖x − x̂‖²',src:'TREND LINEAGE · L11 MONO-EDITORIAL · AUTOENCODER FLOW',render(){
      const xs=[75,235,400,565,725], labels=['INPUT x','ENCODER','LATENT z','DECODER','RECONSTRUCTION x̂'], sizes=[120,115,90,115,140];const tips=['the original features','compresses x into fewer dimensions','the compact code, the bottleneck','expands z back to the input size','compared with x: training minimizes ‖x − x̂‖²'];xs.forEach((x,i)=>{if(i<4)arrow(x+sizes[i]/2-5,157,xs[i+1]-sizes[i+1]/2+5,157,.12*i,{'data-edge':`a${i}>a${i+1}`});labelBox(x-sizes[i]/2,133,sizes[i],48,labels[i],i===2,{'data-node':`a${i}`,'data-tip':`${T(labels[i])}\n${tips[i]}`})});text(400,225,'THE BOTTLENECK RETAINS ONLY THE STRUCTURE NEEDED TO RECONSTRUCT',{fill:G2,'text-anchor':'middle','font-size':9,'letter-spacing':'.08em'});
    }},
    hierarchy:{title:'The dendrogram preserves every possible cluster cut.',sub:'agglomerative example · merge height represents dissimilarity · cut height determines K',src:'TREE LR · G7 MONO · HIERARCHICAL CLUSTERING',render(){
      // Each mark carries its place in the tree: hovering a leaf lights the merges above it.
      const x=[125,260,520,675], base=270, leaf=['all/AB/A','all/AB/B','all/CD/C','all/CD/D'];
      const P=(path,tip)=>(tip?{'data-path':path,'data-tip':tip}:{'data-path':path});
      ['A','B','C','D'].forEach((s,i)=>{dot(x[i],base,5,{style:`animation-delay:${i*.08}s`,...P(leaf[i],`Observation ${s}\n${i<2?'merges first, with '+(i?'A':'B'):'merges with '+(i===2?'D':'C')+' only above the cut'}`)});text(x[i],295,s,{'text-anchor':'middle','font-weight':800,...P(leaf[i])})});
      const ab=P('all/AB','A + B\nthe most similar pair, merged at a low height'),cd=P('all/CD','C + D\nmerged above the cut, so they stay apart at K = 3'),top=P('all','All four\nthe last merge, at the greatest dissimilarity');
      line(125,270,125,190,P(leaf[0]));line(260,270,260,190,P(leaf[1]));line(125,190,260,190,ab);line(192.5,190,192.5,105,ab);line(520,270,520,120,P(leaf[2]));line(675,270,675,120,P(leaf[3]));line(520,120,675,120,cd);line(597.5,120,597.5,105,cd);line(192.5,105,597.5,105,top);line(395,105,395,65,top);
      [[125,190,260,190,ab],[520,120,675,120,cd],[192.5,105,597.5,105,top]].forEach(([a,b,c,d,h])=>hit(a,b,c,d,h));
      line(65,135,735,135,{stroke:G3,'stroke-dasharray':'6 5','data-tip':'Cut height\nbranches crossing it: {A, B}, {C}, {D} → K = 3'});hit(65,135,735,135,{'data-tip':'Cut height\nbranches crossing it: {A, B}, {C}, {D} → K = 3'});text(70,126,'CUT HERE → 3 CLUSTERS',{'font-size':9,'letter-spacing':'.08em',fill:INK});
    }},
    neural:{title:'Hidden neurons combine every input into learned representations.',sub:'lines = learned weights · nodes = neurons · nonlinear activations create flexible boundaries',src:'RADIAL CONVERGENCE · L5 MONO-EDITORIAL · FEEDFORWARD NETWORK',render(){
      const cols=[{x:105,ys:[80,155,230],l:['x₁','x₂','x₃']},{x:330,ys:[65,125,185,245],l:['h₁','h₂','h₃','h₄']},{x:555,ys:[100,205],l:['h₅','h₆']},{x:720,ys:[155],l:['ŷ']}];cols.slice(0,-1).forEach((c,ci)=>c.ys.forEach((y,i)=>cols[ci+1].ys.forEach((ny,j)=>line(c.x,y,cols[ci+1].x,ny,{stroke:(i+j)%3===0?G3:G6,'stroke-width':.7,style:`animation-delay:${.02*(i+j+ci)}s`,'data-edge':`${ci}-${i}>${ci+1}-${j}`}))));
      // A neuron lights its weights and the neurons on their other ends.
      const role=(ci,i)=>ci===0?`input feature · feeds all ${cols[1].ys.length} first-layer neurons`:ci===3?`prediction · weighs ${cols[2].ys.length} second-layer neurons`:`weighted sum of ${cols[ci-1].ys.length} inputs, then a nonlinear activation`;
      cols.forEach((c,ci)=>c.ys.forEach((y,i)=>{const hover={'data-node':`${ci}-${i}`,'data-tip':`${c.l[i]}\n${role(ci,i)}`};dot(c.x,y,ci===3?15:10,{fill:ci===3?INK:ci===0?G2:PAPER,stroke:INK,'stroke-width':1.4,style:`animation-delay:${.3+ci*.15}s`,...hover});text(c.x,y+3,c.l[i],{fill:ci===0||ci===3?PAPER:INK,'text-anchor':'middle','font-size':9,'font-weight':800,class:'fade',style:`animation-delay:${.4+ci*.15}s`,...hover})}));['INPUT','HIDDEN 1','HIDDEN 2','OUTPUT'].forEach((s,i)=>text(cols[i].x,292,s,{'text-anchor':'middle','font-size':8,'letter-spacing':'.12em'}));
    }},
    rl:{title:'Each action changes both the reward and what happens next.',sub:'closed feedback loop · policy balances exploration with exploitation',src:'TREND LINEAGE · L11 MONO-EDITORIAL · REINFORCEMENT LOOP',render(){
      const n=[[105,130,130,'STATE sₜ'],[325,65,145,'AGENT / POLICY'],[565,65,145,'ACTION aₜ'],[675,205,160,'ENVIRONMENT'],[355,220,205,'REWARD rₜ₊₁ + NEW STATE']];const tips=['what the agent observes now','chooses an action from the state','what the agent does','responds to the action','feeds back into the next decision'];n.forEach((d,i)=>labelBox(d[0]-d[2]/2,d[1],d[2],46,d[3],i===1,{'data-node':`r${i}`,'data-tip':`${T(d[3])}\n${tips[i]}`}));[[170,153,252,95],[398,88,492,88],[605,111,650,205],[595,228,458,243],[252,243,150,176]].forEach(([a,b,c,d],i)=>arrow(a,b,c,d,.1*(i+1),{'data-edge':`r${i}>r${(i+1)%5}`}));text(400,298,'MAXIMIZE EXPECTED DISCOUNTED CUMULATIVE REWARD',{'text-anchor':'middle','font-size':9,'letter-spacing':'.1em',fill:INK});
    }}
  };
  function render(){svg.innerHTML='';defs();const key=new URLSearchParams(location.search).get('view')||'svm',v=V[key]||V.svm;document.querySelector('#title').textContent=v.title;document.querySelector('#sub').textContent=v.sub;document.querySelector('#src').textContent=v.src;svg.setAttribute('aria-label',v.title);v.render()}
