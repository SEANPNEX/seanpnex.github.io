  <script>
  const NS='http://www.w3.org/2000/svg', PAPER='#F0EFEB',INK='#1C1C1A',G1='#4A4944',G2='#6A6963',G3='#8A8983',G4='#A8A7A0',G5='#B0AFA9',G6='#C6C5BF',GRID='#D8D6CE',FAINT='#E3E2DB';
  const rnd=(a,b)=>{let x=Math.sin(a*127.1+b*311.7)*43758.5453;return x-Math.floor(x)};
  const svg=document.querySelector('#chart');
  const el=(tag,a={},text='')=>{const n=document.createElementNS(NS,tag);Object.entries(a).forEach(([k,v])=>n.setAttribute(k,v));if(text)n.textContent=text;svg.append(n);return n};
  const line=(x1,y1,x2,y2,a={})=>el('line',{x1,y1,x2,y2,stroke:G5,'stroke-width':1,pathLength:1,class:'draw',...a});
  const text=(x,y,s,a={})=>el('text',{x,y,fill:G2,'font-size':10,'font-weight':600,...a},s);
  const dot=(x,y,r=5,a={})=>{const n=el('circle',{cx:x,cy:y,r,fill:INK,class:'pop',...a});return n};
  const labelBox=(x,y,w,h,label,dark=false)=>{el('rect',{x,y,width:w,height:h,rx:12,fill:dark?INK:FAINT,class:'pop'});text(x+w/2,y+h/2+4,label,{fill:dark?PAPER:INK,'text-anchor':'middle','font-size':11,'font-weight':800,class:'fade'});};
  const arrow=(x1,y1,x2,y2,delay=0)=>{line(x1,y1,x2,y2,{stroke:G4,'stroke-width':1.2,'marker-end':'url(#arrow)',style:`animation-delay:${delay}s`})};
  function defs(){const d=el('defs'),m=document.createElementNS(NS,'marker');m.setAttribute('id','arrow');m.setAttribute('viewBox','0 0 10 10');m.setAttribute('refX','8');m.setAttribute('refY','5');m.setAttribute('markerWidth','6');m.setAttribute('markerHeight','6');m.setAttribute('orient','auto-start-reverse');const p=document.createElementNS(NS,'path');p.setAttribute('d','M 0 0 L 10 5 L 0 10 z');p.setAttribute('fill',G4);m.append(p);d.append(m)}
  const V={
    svm:{title:'The widest safe street defines the classifier.',sub:'two classes · solid line = decision boundary · dashed lines = margins · circled points = support vectors',src:'PLUMB SCATTER · F8 MONO-BASIC · ILLUSTRATIVE DATA',render(){
      const pts=[];for(let i=0;i<14;i++)pts.push([125+rnd(i,2)*210,65+rnd(i,5)*105,'+']);for(let i=0;i<14;i++)pts.push([465+rnd(i,7)*210,150+rnd(i,9)*105,'−']);
      for(let x=55;x<=745;x+=34)line(x,270,x,264,{stroke:GRID,'stroke-width':.7,style:`animation-delay:${x/3000}s`});line(55,270,745,270,{stroke:GRID});
      [[315,45,465,275,'5 5'],[365,45,515,275,'none'],[415,45,565,275,'5 5']].forEach((d,i)=>line(d[0],d[1],d[2],d[3],{stroke:i===1?INK:G4,'stroke-width':i===1?2:1,'stroke-dasharray':d[4],style:`animation-delay:${.2+i*.12}s`}));
      pts.forEach(([x,y,c],i)=>{line(x,270,x,y,{stroke:FAINT,'stroke-width':.55,style:`animation-delay:${.25+i*.018}s`});dot(x,y,4,{fill:c==='+'?INK:PAPER,stroke:INK,'stroke-width':1.4,style:`animation-delay:${.3+i*.018}s`});text(x,y+3,c,{fill:c==='+'?PAPER:INK,'text-anchor':'middle','font-size':8,class:'fade',style:`animation-delay:${.45+i*.018}s`})});
      text(526,68,'MAXIMUM MARGIN',{fill:INK,'font-size':9,'letter-spacing':'.1em'});text(60,294,'FEATURE 1 →',{'font-size':8,'letter-spacing':'.1em'});
    }},
    cart:{title:'Every split narrows the decision.',sub:'binary classification tree · terminal leaves return the majority class',src:'TREE LR · G7 MONO · DIVIDEND-CLASSIFICATION EXAMPLE',render(){
      const nodes=[[400,35,190,44,'FCF growth > 4%?'],[255,130,175,44,'No increase'],[545,130,200,44,'Interest coverage > 3×?'],[455,230,175,44,'No increase'],[650,230,175,44,'Increase']];
      [[400,79,255,130],[400,79,545,130],[545,174,455,230],[545,174,650,230]].forEach((d,i)=>arrow(...d,i*.12));nodes.forEach((n,i)=>labelBox(n[0]-n[2]/2,n[1],n[2],n[3],n[4],i===4));text(303,102,'NO',{'font-size':8});text(487,102,'YES',{'font-size':8});text(486,207,'NO',{'font-size':8});text(605,207,'YES',{'font-size':8});
    }},

      feats.forEach((f,i)=>{const a=-155+i*310/(feats.length-1),x=400+330*Math.cos(a*Math.PI/180),y=160+125*Math.sin(a*Math.PI/180),h=i<4?0:i<7?1:2;const [hx,hy]=hubs[h];el('path',{d:`M${x} ${y} Q400 160 ${hx} ${hy}`,fill:'none',stroke:G5,'stroke-width':.8,pathLength:1,class:'draw',style:`animation-delay:${i*.07}s`});dot(x,y,3,{fill:G2,style:`animation-delay:${i*.07}s`});text(x,y+(y<160?-9:15),f,{'text-anchor':'middle','font-size':8,class:'fade'})});hubs.forEach(([x,y,s,r],i)=>{dot(x,y,r,{style:`animation-delay:${.45+i*.12}s`});text(x,y+4,s,{fill:PAPER,'text-anchor':'middle','font-size':9,'font-weight':800,class:'fade',style:`animation-delay:${.55+i*.12}s`})});
    }},
    autoencoder:{title:'Compression succeeds only if the decoder can rebuild the input.',sub:'encoder → bottleneck → decoder · training minimizes reconstruction error ‖x − x̂‖²',src:'TREND LINEAGE · L11 MONO-EDITORIAL · AUTOENCODER FLOW',render(){
      const xs=[75,235,400,565,725], labels=['INPUT x','ENCODER','LATENT z','DECODER','RECONSTRUCTION x̂'], sizes=[120,115,90,115,140];xs.forEach((x,i)=>{if(i<4)arrow(x+sizes[i]/2-5,157,xs[i+1]-sizes[i+1]/2+5,157,.12*i);labelBox(x-sizes[i]/2,133,sizes[i],48,labels[i],i===2)});text(400,225,'THE BOTTLENECK RETAINS ONLY THE STRUCTURE NEEDED TO RECONSTRUCT',{fill:G2,'text-anchor':'middle','font-size':9,'letter-spacing':'.08em'});
    }},
    hierarchy:{title:'The dendrogram preserves every possible cluster cut.',sub:'agglomerative example · merge height represents dissimilarity · cut height determines K',src:'TREE LR · G7 MONO · HIERARCHICAL CLUSTERING',render(){
      const x=[125,260,520,675], base=270;['A','B','C','D'].forEach((s,i)=>{dot(x[i],base,5,{style:`animation-delay:${i*.08}s`});text(x[i],295,s,{'text-anchor':'middle','font-weight':800})});line(125,270,125,190);line(260,270,260,190);line(125,190,260,190);line(192.5,190,192.5,105);line(520,270,520,155);line(675,270,675,155);line(520,155,675,155);line(597.5,155,597.5,105);line(192.5,105,597.5,105);line(395,105,395,65);line(65,135,735,135,{stroke:G3,'stroke-dasharray':'6 5'});text(70,126,'CUT HERE → 3 CLUSTERS',{'font-size':9,'letter-spacing':'.08em',fill:INK});
    }},
    neural:{title:'Hidden neurons combine every input into learned representations.',sub:'lines = learned weights · nodes = neurons · nonlinear activations create flexible boundaries',src:'RADIAL CONVERGENCE · L5 MONO-EDITORIAL · FEEDFORWARD NETWORK',render(){
      const cols=[{x:105,ys:[80,155,230],l:['x₁','x₂','x₃']},{x:330,ys:[65,125,185,245],l:['h₁','h₂','h₃','h₄']},{x:555,ys:[100,205],l:['h₅','h₆']},{x:720,ys:[155],l:['ŷ']}];cols.slice(0,-1).forEach((c,ci)=>c.ys.forEach((y,i)=>cols[ci+1].ys.forEach((ny,j)=>line(c.x,y,cols[ci+1].x,ny,{stroke:(i+j)%3===0?G3:G6,'stroke-width':.7,style:`animation-delay:${.02*(i+j+ci)}s`}))));cols.forEach((c,ci)=>c.ys.forEach((y,i)=>{dot(c.x,y,ci===3?15:10,{fill:ci===3?INK:ci===0?G2:PAPER,stroke:INK,'stroke-width':1.4,style:`animation-delay:${.3+ci*.15}s`});text(c.x,y+3,c.l[i],{fill:ci===0||ci===3?PAPER:INK,'text-anchor':'middle','font-size':9,'font-weight':800,class:'fade',style:`animation-delay:${.4+ci*.15}s`})}));['INPUT','HIDDEN 1','HIDDEN 2','OUTPUT'].forEach((s,i)=>text(cols[i].x,292,s,{'text-anchor':'middle','font-size':8,'letter-spacing':'.12em'}));
    }},
    rl:{title:'Each action changes both the reward and what happens next.',sub:'closed feedback loop · policy balances exploration with exploitation',src:'TREND LINEAGE · L11 MONO-EDITORIAL · REINFORCEMENT LOOP',render(){
      const n=[[105,130,130,'STATE sₜ'],[325,65,145,'AGENT / POLICY'],[565,65,145,'ACTION aₜ'],[675,205,160,'ENVIRONMENT'],[355,220,205,'REWARD rₜ₊₁ + NEW STATE']];n.forEach((d,i)=>labelBox(d[0]-d[2]/2,d[1],d[2],46,d[3],i===1));arrow(170,153,252,95,.1);arrow(398,88,492,88,.2);arrow(605,111,650,205,.3);arrow(595,228,458,243,.4);arrow(252,243,150,176,.5);text(400,298,'MAXIMIZE EXPECTED DISCOUNTED CUMULATIVE REWARD',{'text-anchor':'middle','font-size':9,'letter-spacing':'.1em',fill:INK});
    }}
  };
  function render(){svg.innerHTML='';defs();const key=new URLSearchParams(location.search).get('view')||'svm',v=V[key]||V.svm;document.querySelector('#title').textContent=v.title;document.querySelector('#sub').textContent=v.sub;document.querySelector('#src').textContent=v.src;svg.setAttribute('aria-label',v.title);v.render()}
