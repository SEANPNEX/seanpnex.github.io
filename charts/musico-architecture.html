  <script>
(() => {
  const { C, T, el, mount } = curveKit;

  const CLIENTS = [
    {
      id: 'apple',
      eyebrow: '01 · APPLE',
      title: 'iOS 17+ · iPadOS · macOS',
      lines: [
        'SwiftUI · Frosted Glass · Cmd+K',
        'AVAudioEngine · AVAudioUnitEQ',
        'Mini-Player · JavaScriptCore',
      ],
      tip: 'Apple Client\nSwiftUI + NSVisualEffectView + AVAudioEngine + JSC · Appearance, Cmd+K, Mini-Player & Drag & Drop',
    },
    {
      id: 'android',
      eyebrow: '02 · ANDROID',
      title: 'Android 8.0+ (API 26+)',
      lines: [
        'Kotlin · Compose M3 · Appearance',
        'Media3 ExoPlayer · SAF',
        'DynamicsProcessing · QuickJS',
      ],
      tip: 'Android Client\nJetpack Compose M3 + Media3 ExoPlayer + QuickJS · WCAG 2.1 Appearance, Top Stats & Device Delete',
    },
    {
      id: 'windows',
      eyebrow: '03 · WINDOWS',
      title: 'Windows 10 / 11 (.NET 8)',
      lines: [
        'C# · WPF · DWM Acrylic',
        'NAudio BiQuad EQ · Drag & Drop',
        'Ctrl+K · Mini-Player · Jint',
      ],
      tip: 'Windows Client\n.NET 8 WPF + DWM Acrylic + NAudio + Jint · Ctrl+K Palette, Mini-Player & Drag & Drop',
    },
  ];

  const MODULES = [
    {
      id: 'library',
      label: 'Folder-First Library',
      tip: 'Folder-First Library\nPreserves folder trees with Drag & Drop, Relocate, safe disk delete & .musico-cloud.json sync',
    },
    {
      id: 'queues',
      label: 'Multi-Queue Engine',
      tip: 'Multi-Queue Engine\nParallel independent queues with per-queue position, shuffle, repeat & Top Artists / Albums stats',
    },
    {
      id: 'eq',
      label: '10-Band EQ & .LRC Lyrics',
      tip: '10-Band EQ & .LRC Lyrics\n31 Hz–16 kHz ISO bands + Imported / Sidecar / Embedded lyrics with font, alignment & line sync',
    },
    {
      id: 'runtime',
      label: '.musicoext JS Runtime',
      tip: 'JS Extension Runtime\nCommonJS API v1 (JavaScriptCore / QuickJS / Jint) with web_login ephemeral WebView, qr_login & cookies.txt',
    },
  ];

  const SOURCES = [
    {
      id: 'local',
      label: 'Local Folders (FLAC / ALAC / MP3 / OGG / OPUS)',
      parent: 'core',
      tip: 'Local Folders\nDirect filesystem, SAF & Drag & Drop playback with Move to Trash / Recycle Bin / Device Delete',
    },
    {
      id: 'cloud',
      label: 'YouTube · Bilibili · Google Drive',
      parent: 'core',
      tip: 'Built-In Cloud Hangouts\nYouTube, Bilibili & Google Drive (zero-login public or optional OAuth 2.0) with offline save',
    },
    {
      id: 'ext',
      label: 'Official & .musico.js Plugins',
      parent: 'runtime',
      tip: 'Official & Community Extensions\nYouTube v1.2.0 (web_login), Bilibili v1.2.0 (qr_login), NetEase v1.2.0, Apple Music v1.0.1 & cookies.txt',
    },
  ];

  const isStacked = (w) => w < 620;
  const height = (w) => (isStacked(w) ? 810 : 418);

  function addFittedText(svg, x, y, str, opts) {
    const t = el(svg, 'text', {
      x,
      y,
      'font-size': opts.size || 12,
      'font-weight': opts.weight || 600,
      fill: opts.fill || C.INK,
      'text-anchor': opts.anchor || 'start',
      'letter-spacing': opts.tracking || null,
    }, T(str));
    if (opts.maxWidth) {
      const len = t.getComputedTextLength();
      if (len > opts.maxWidth && len > 0) {
        const nextSize = Math.max(9.2, (opts.size || 12) * (opts.maxWidth / len));
        t.setAttribute('font-size', nextSize.toFixed(1));
      }
    }
    return t;
  }

  mount(document.getElementById('arch'), (svg, W) => {
    const narrow = isStacked(W);

    if (narrow) {
      let y = 6;
      const cardH = 122;
      const cardGap = 12;

      CLIENTS.forEach((client, idx) => {
        const g = el(svg, 'g', {
          class: 'fade',
          style: `animation-delay:${idx * 0.06}s`,
          'data-node': client.id,
          'data-tip': T(client.tip),
        });
        el(g, 'rect', {
          x: 0, y, width: W, height: cardH, rx: 14,
          fill: '#E7E6E0', stroke: '#DEDDD6', 'stroke-width': 1.4,
        });
        addFittedText(g, 16, y + 24, client.eyebrow, { size: 10.5, weight: 700, fill: '#6A6963', tracking: '1.1' });
        addFittedText(g, 16, y + 46, client.title, { size: 15, weight: 800, fill: '#1C1C1A', maxWidth: W - 32 });
        el(g, 'line', { x1: 16, y1: y + 58, x2: W - 16, y2: y + 58, stroke: '#DEDDD6', 'stroke-width': 1 });
        client.lines.forEach((line, i) => {
          addFittedText(g, 16, y + 77 + i * 18, line, {
            size: 12,
            weight: i === 0 ? 600 : 500,
            fill: i === 0 ? '#4A4944' : '#6A6963',
            maxWidth: W - 32,
          });
        });
        y += cardH + cardGap;
      });

      // Connector down to shared core
      const connTop = y - cardGap;
      const connBot = connTop + 20;
      el(svg, 'line', {
        x1: W / 2, y1: connTop, x2: W / 2, y2: connBot,
        stroke: '#B0AFA9', 'stroke-width': 1.5, pathLength: 1, class: 'draw',
        'data-edge': 'apple>core',
      });
      el(svg, 'line', {
        x1: W / 2, y1: connTop, x2: W / 2, y2: connBot,
        stroke: 'transparent', 'stroke-width': 8, 'data-edge': 'android>core',
      });
      el(svg, 'line', {
        x1: W / 2, y1: connTop, x2: W / 2, y2: connBot,
        stroke: 'transparent', 'stroke-width': 8, 'data-edge': 'windows>core',
      });
      el(svg, 'circle', { cx: W / 2, cy: connTop, r: 3, fill: '#1C1C1A', class: 'pop' });

      y = connBot;
      const coreH = 212;
      const coreG = el(svg, 'g', {
        class: 'fade',
        style: 'animation-delay:0.22s',
        'data-node': 'core',
        'data-tip': T('Shared Core Contract\nUnified library semantics, WCAG 2.1 Appearance, multi-queue persistence, EQ & JS API v1'),
      });
      el(coreG, 'rect', { x: 0, y, width: W, height: coreH, rx: 16, fill: '#1C1C1A' });
      addFittedText(coreG, 16, y + 25, 'SHARED CORE & EXTENSIONS', { size: 10.5, weight: 700, fill: '#B0AFA9', tracking: '1.1' });

      MODULES.forEach((mod, i) => {
        const my = y + 38 + i * 41;
        const mg = el(svg, 'g', {
          class: 'fade',
          style: `animation-delay:${0.26 + i * 0.04}s`,
          'data-node': mod.id,
          'data-tip': T(mod.tip),
        });
        el(mg, 'rect', { x: 14, y: my, width: W - 28, height: 33, rx: 9, fill: '#2E2D29' });
        addFittedText(mg, W / 2, my + 21, mod.label, {
          size: 12.5, weight: 700, fill: '#F0EFEB', anchor: 'middle', maxWidth: W - 48,
        });
      });

      const srcTop = y + coreH;
      const srcY = srcTop + 20;
      el(svg, 'line', {
        x1: W / 2, y1: srcTop, x2: W / 2, y2: srcY,
        stroke: '#B0AFA9', 'stroke-width': 1.5, pathLength: 1, class: 'draw',
        'data-edge': 'core>local',
      });

      const srcH = 158;
      const srcOuter = el(svg, 'g', { class: 'fade', style: 'animation-delay:0.38s' });
      el(srcOuter, 'rect', {
        x: 0, y: srcY, width: W, height: srcH, rx: 16,
        fill: '#E7E6E0', stroke: '#DEDDD6', 'stroke-width': 1.4,
      });
      addFittedText(srcOuter, 16, srcY + 24, 'LOCAL & CLOUD SOURCES', { size: 10.5, weight: 700, fill: '#6A6963', tracking: '1.1' });

      SOURCES.forEach((src, i) => {
        const sy = srcY + 36 + i * 38;
        const sg = el(svg, 'g', {
          'data-node': src.id,
          'data-tip': T(src.tip),
        });
        el(sg, 'rect', {
          x: 14, y: sy, width: W - 28, height: 30, rx: 8,
          fill: '#F0EFEB', stroke: '#DEDDD6', 'stroke-width': 1,
        });
        addFittedText(sg, W / 2, sy + 19.5, src.label, {
          size: 12, weight: 600, fill: '#1C1C1A', anchor: 'middle', maxWidth: W - 44,
        });
      });
      return;
    }

    // Desktop / wide layout (3 columns)
    const gap = 16;
    const cardW = (W - gap * 2) / 3;
    const cardY = 6;
    const cardH = 162;

    const clientCenters = [];
    CLIENTS.forEach((client, idx) => {
      const x = idx * (cardW + gap);
      const cx = x + cardW / 2;
      clientCenters.push(cx);

      const g = el(svg, 'g', {
        class: 'fade',
        style: `animation-delay:${idx * 0.06}s`,
        'data-node': client.id,
        'data-tip': T(client.tip),
      });
      el(g, 'rect', {
        x, y: cardY, width: cardW, height: cardH, rx: 16,
        fill: '#E7E6E0', stroke: '#DEDDD6', 'stroke-width': 1.4,
      });
      addFittedText(g, x + 18, cardY + 27, client.eyebrow, { size: 11, weight: 700, fill: '#6A6963', tracking: '1.1' });
      addFittedText(g, x + 18, cardY + 53, client.title, { size: 15.5, weight: 800, fill: '#1C1C1A', maxWidth: cardW - 36 });
      el(g, 'line', { x1: x + 18, y1: cardY + 68, x2: x + cardW - 18, y2: cardY + 68, stroke: '#DEDDD6', 'stroke-width': 1 });

      client.lines.forEach((line, i) => {
        addFittedText(g, x + 18, cardY + 92 + i * 24, line, {
          size: 12.5,
          weight: i === 0 ? 600 : 500,
          fill: i === 0 ? '#4A4944' : '#6A6963',
          maxWidth: cardW - 36,
        });
      });
    });

    // Connectors from 3 clients down to Shared Core bar
    const connY0 = cardY + cardH;
    const busY = connY0 + 18;
    const coreY = connY0 + 34;

    el(svg, 'path', {
      d: `M${clientCenters[0]} ${connY0} V${busY} H${clientCenters[1]} V${coreY}`,
      fill: 'none', stroke: '#B0AFA9', 'stroke-width': 1.5, pathLength: 1, class: 'draw',
      style: 'animation-delay:0.18s', 'data-edge': 'apple>core',
    });
    el(svg, 'path', {
      d: `M${clientCenters[1]} ${connY0} V${coreY}`,
      fill: 'none', stroke: '#B0AFA9', 'stroke-width': 1.5, pathLength: 1, class: 'draw',
      style: 'animation-delay:0.2s', 'data-edge': 'android>core',
    });
    el(svg, 'path', {
      d: `M${clientCenters[2]} ${connY0} V${busY} H${clientCenters[1]} V${coreY}`,
      fill: 'none', stroke: '#B0AFA9', 'stroke-width': 1.5, pathLength: 1, class: 'draw',
      style: 'animation-delay:0.22s', 'data-edge': 'windows>core',
    });
    clientCenters.forEach((cx, idx) => {
      el(svg, 'circle', {
        cx, cy: connY0, r: 3, fill: '#1C1C1A', class: 'pop',
        style: `animation-delay:${0.18 + idx * 0.03}s`,
        'data-node': CLIENTS[idx].id,
      });
    });

    // Shared Core bar
    const coreH = 92;
    const coreGroup = el(svg, 'g', {
      class: 'fade',
      style: 'animation-delay:0.24s',
      'data-node': 'core',
      'data-tip': T('Shared Core Contract\nUnified library semantics, WCAG 2.1 Appearance, multi-queue persistence, EQ & JS API v1'),
    });
    el(coreGroup, 'rect', { x: 0, y: coreY, width: W, height: coreH, rx: 16, fill: '#1C1C1A' });
    addFittedText(coreGroup, 18, coreY + 26, 'SHARED CORE & EXTENSIONS', { size: 11, weight: 700, fill: '#B0AFA9', tracking: '1.1' });

    const modPad = 18;
    const modGap = 12;
    const modW = (W - modPad * 2 - modGap * 3) / 4;
    const modCenters = [];
    MODULES.forEach((mod, i) => {
      const mx = modPad + i * (modW + modGap);
      modCenters.push(mx + modW / 2);
      const mg = el(svg, 'g', {
        class: 'fade',
        style: `animation-delay:${0.28 + i * 0.04}s`,
        'data-node': mod.id,
        'data-tip': T(mod.tip),
      });
      el(mg, 'rect', { x: mx, y: coreY + 39, width: modW, height: 37, rx: 10, fill: '#2E2D29' });
      addFittedText(mg, mx + modW / 2, coreY + 62, mod.label, {
        size: 12.5, weight: 700, fill: '#F0EFEB', anchor: 'middle', maxWidth: modW - 18,
      });
    });

    // Connectors from Shared Core -> Sources
    const srcConnY0 = coreY + coreH;
    const srcY = srcConnY0 + 24;
    const srcH = 82;

    const srcPad = 18;
    const srcGap = 12;
    const availSrc = W - srcPad * 2 - srcGap * 2;
    const srcWidths = [availSrc * 0.42, availSrc * 0.30, availSrc * 0.28];
    const srcXs = [srcPad, srcPad + srcWidths[0] + srcGap, srcPad + srcWidths[0] + srcGap + srcWidths[1] + srcGap];

    el(svg, 'path', {
      d: `M${srcXs[0] + srcWidths[0] / 2} ${srcConnY0} V${srcY}`,
      fill: 'none', stroke: '#B0AFA9', 'stroke-width': 1.5, pathLength: 1, class: 'draw',
      style: 'animation-delay:0.38s', 'data-edge': 'core>local',
    });
    el(svg, 'path', {
      d: `M${srcXs[1] + srcWidths[1] / 2} ${srcConnY0} V${srcY}`,
      fill: 'none', stroke: '#B0AFA9', 'stroke-width': 1.5, pathLength: 1, class: 'draw',
      style: 'animation-delay:0.4s', 'data-edge': 'core>cloud',
    });
    el(svg, 'path', {
      d: `M${modCenters[3]} ${srcConnY0} V${srcY}`,
      fill: 'none', stroke: '#B0AFA9', 'stroke-width': 1.5, pathLength: 1, class: 'draw',
      style: 'animation-delay:0.42s', 'data-edge': 'runtime>ext',
    });

    // Bottom Sources strip
    const srcOuter = el(svg, 'g', { class: 'fade', style: 'animation-delay:0.36s' });
    el(srcOuter, 'rect', {
      x: 0, y: srcY, width: W, height: srcH, rx: 16,
      fill: '#E7E6E0', stroke: '#DEDDD6', 'stroke-width': 1.4,
    });
    addFittedText(srcOuter, 18, srcY + 25, 'LOCAL & CLOUD SOURCES', { size: 11, weight: 700, fill: '#6A6963', tracking: '1.1' });

    SOURCES.forEach((src, i) => {
      const sx = srcXs[i];
      const sw = srcWidths[i];
      const sg = el(svg, 'g', {
        class: 'fade',
        style: `animation-delay:${0.4 + i * 0.05}s`,
        'data-node': src.id,
        'data-tip': T(src.tip),
      });
      el(sg, 'rect', {
        x: sx, y: srcY + 37, width: sw, height: 32, rx: 8,
        fill: '#F0EFEB', stroke: '#DEDDD6', 'stroke-width': 1,
      });
      addFittedText(sg, sx + sw / 2, srcY + 57.5, src.label, {
        size: 12.5, weight: 600, fill: '#1C1C1A', anchor: 'middle', maxWidth: sw - 16,
      });
    });
  }, height);
})();
  </script>
</body>
</html>
