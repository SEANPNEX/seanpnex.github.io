  <script>
(() => {
  const { C, T, el, label, frame, axes, curve, beads, guide, dot, arrow, points, probe, mount, html } = curveKit;
  const ALPHA = 0.4, A0 = 1, A1 = 1.55, K = 8;
  const lo = (k) => A0 * Math.pow(k, ALPHA), hi = (k) => A1 * Math.pow(k, ALPHA);
  // A → B moves along the baseline curve; B → C lifts it at the same k.
  const kA = 1.6, kB = 3.6;
  const height = (w) => Math.max(250, Math.min(290, w * 0.52));

  html('#sub', 'y = A kα · α fixed · along-curve = capital deepening · vertical shift = TFP ↑', [['kα', 'k<sup>α</sup>']]);
  html('#src', 'CAPITAL DEEPENING VS TFP · F2 HAIRLINE LINE · y = A kα', [['y = A kα', '<span class="f">y = A k<sup>α</sup></span>']]);

  mount(document.getElementById('prod'), (s, W, H) => {
    const F = frame(s, W, H, { l: 34, r: 12, t: 30, b: 32 }, K, hi(K) * 1.1);
    axes(s, F, T('capital intensity k →'), T('output y'));
    const P = { A: [kA, lo(kA)], B: [kB, lo(kB)], C: [kB, hi(kB)] };
    const px = (n) => [F.x(P[n][0]), F.y(P[n][1])];

    // Guides from each point to both axes.
    ['A', 'B', 'C'].forEach((n, i) => {
      const [x, y] = px(n);
      guide(s, F.X0, y, x, y, 0.45 + i * 0.05);
      label(s, F.X0 - 5, y + 4, `y_{${n}}`, { size: 10.5, weight: 700, fill: n === 'C' ? C.INK : C.MUTED, anchor: 'end', delay: 0.5 + i * 0.05 });
    });
    ['A', 'B'].forEach((n, i) => {
      const [x, y] = px(n);
      guide(s, x, y + 5, x, F.BASE, 0.45 + i * 0.05);
      label(s, x, F.BASE + 15, `k_{${n}}`, { size: 10.5, weight: 700, fill: C.MUTED, anchor: 'middle', delay: 0.5 + i * 0.05 });
    });

    curve(s, F, lo, 0, K, { stroke: C.SOFT, width: 1.3 });
    curve(s, F, hi, 0, K, { delay: 0.08 });
    beads(s, F, lo, 0.4, K, { fill: C.SOFT, r: 1.4, avoid: [kA, kB] });
    beads(s, F, hi, 0.4, K, { avoid: [kB] });
    label(s, F.X1, F.y(hi(K)) - 9, T('higher A'), { anchor: 'end', delay: 0.8 });
    label(s, F.X1, F.y(lo(K)) - 9, T('baseline A'), { fill: C.MUTED, anchor: 'end', delay: 0.7 });

    // Capital deepening: an arrow that follows the baseline curve just beneath it.
    const along = points(F, lo, kA + 0.2, kB - 0.25, 30).map(([x, y]) => [x, y + 11]);
    arrow(s, along, { stroke: C.MUTED, delay: 0.85 });
    const room = F.x(kB) - F.x(kA) - 14;
    label(s, (F.x(kA) + F.x(kB)) / 2 + 4, F.y(lo((kA + kB) / 2)) + 34, T('capital deepening'), {
      size: 10.5, fill: C.MUTED, anchor: 'middle', maxWidth: room, delay: 0.95,
    });

    // TFP: B straight up to C.
    const [bx, by] = px('B'), [, cy] = px('C');
    arrow(s, [[bx, by - 7], [bx, cy + 7]], { width: 1.6, delay: 1.0 });
    label(s, bx + 8, (by + cy) / 2 + 4, T('TFP ↑'), { size: 12, delay: 1.05 });

    dot(s, ...px('A'), 4.4, C.SOFT, 0.55, `A · capital deepening starts\nk = ${kA} · y = ${lo(kA).toFixed(2)}`);
    dot(s, ...px('B'), 4.4, C.SOFT, 0.63, `B · more k, same A\nk = ${kB} · y = ${lo(kB).toFixed(2)}`);
    dot(s, ...px('C'), 4.6, C.INK, 0.71, `C · same k, higher A\nk = ${kB} · y = ${hi(kB).toFixed(2)}`);
    label(s, px('A')[0] - 7, px('A')[1] - 7, 'A', { size: 12.5, fill: C.MUTED, anchor: 'end', delay: 0.65 });
    label(s, px('B')[0] + 9, px('B')[1] + 16, 'B', { size: 13, fill: C.MUTED, delay: 0.73 });
    label(s, px('C')[0] - 8, px('C')[1] - 8, 'C', { size: 13, anchor: 'end', delay: 0.81 });
    probe(s, F, [{ name: 'higher A', f: hi }, { name: 'baseline A', f: lo, stroke: C.SOFT }]);
  }, height);
})();
