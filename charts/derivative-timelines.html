  mount(document.getElementById('chart'), (s, W, H) => {
    const L = 22, R = W - 22, Y = 96, x = (a) => L + a * (R - L);
    el(s, 'line', { x1: L, y1: Y, x2: R, y2: Y, stroke: C.INK, 'stroke-width': 1.4, pathLength: 1, class: 'draw' });

    // Brackets above the axis.
    V.brackets.forEach((b, i) => {
      const x1 = x(V.points[b.from].at), x2 = x(V.points[b.to].at), yb = Y - 34;
      el(s, 'path', { d: `M${x1 + 2} ${yb + 7} L${x1 + 2} ${yb} L${x2 - 2} ${yb} L${x2 - 2} ${yb + 7}`, fill: 'none', stroke: MID, 'stroke-width': 1.1, class: 'fade', style: `animation-delay:${0.3 + i * 0.1}s` });
      label(s, (x1 + x2) / 2, yb - 7, b.text, { size: 10, weight: 700, fill: MID, anchor: 'middle', delay: 0.4 + i * 0.1, maxWidth: x2 - x1 + 10 });
    });

    // Points: a tick, a dot and labels below.
    V.points.forEach((q, i) => {
      const px = x(q.at);
      el(s, 'line', { x1: px, y1: Y - 6, x2: px, y2: Y + 6, stroke: q.soft ? C.SOFT : C.INK, 'stroke-width': 1.2, class: 'fade', style: `animation-delay:${0.2 + i * 0.06}s` });
      const g = el(s, 'circle', { cx: px, cy: Y, r: q.pay ? 3.4 : 4.6, fill: q.soft ? C.PAPER : C.INK, stroke: q.soft ? C.SOFT : C.INK, 'stroke-width': 1.4, class: 'pop', style: `animation-delay:${0.3 + i * 0.06}s`, 'data-tip': q.tip });
      if (q.name) label(s, px, Y + 22, q.name, { size: 12, anchor: 'middle', fill: q.soft ? MID : C.INK, delay: 0.5 });
      if (q.note) {
        // Wrap each caption to the room between its neighbours.
        const last = V.points.length - 1;
        const prev = i > 0 ? px - x(V.points[i - 1].at) : Infinity, next = i < last ? x(V.points[i + 1].at) - px : Infinity;
        const room = i === 0 ? next - 8 : i === last ? prev - 8 : 2 * Math.min(prev, next) - 8;
        label(s, px, Y + 37, q.note, { size: 9.5, weight: 600, fill: C.MUTED, anchor: i === 0 ? 'start' : i === last ? 'end' : 'middle', delay: 0.55, maxWidth: Math.min(room, 130) });
      }
    });

    // Discounting flows below the axis: from a later point back to an earlier one.
    V.flows.forEach((f, i) => {
      // Start below the captions, so the arrows never cross the point labels.
      const x1 = x(V.points[f.from].at), x2 = x(V.points[f.to].at), yb = Y + 76 + (f.row - 1) * 26;
      arrow(s, [[x1, Y + 58], [x1, yb], [x2, yb], [x2, Y + 60]], { stroke: f.soft ? C.SOFT : C.INK, width: 1.2, head: 5, delay: 0.8 + i * 0.15 });
      label(s, (x1 + x2) / 2, yb - 5, f.text, { size: 10, weight: 700, fill: f.soft ? MID : C.INK, anchor: 'middle', delay: 0.9 + i * 0.15 });
    });
  }, () => (V.flows.length ? 214 : 160));
})();
  </script>
