<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Derivative timelines · FRA, option on futures, swaption</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="curve-kit.js"></script>
  <script src="chart-fx.js"></script>
</head>
<body>
  <main class="card" id="card" data-fx-scope>
    <h2 id="title"></h2>
    <div class="sub" id="sub"></div>
    <section class="panel">
      <h3 id="h3"></h3>
      <div class="hint" id="hint"></div>
      <svg id="chart" role="img"></svg>
    </section>
    <div class="src" id="src"></div>
  </main>
  <script>
(() => {
  const { C, el, label, arrow, mount } = curveKit;
  const MID = '#6A6963';

  // ── Data: one timeline per view. Points sit on [0, 1]; brackets span two points; flows are arrows. ──
  const VIEWS = {
    fra: {
      title: 'An FRA’s gain is known at a but earned at b, so it is discounted back.',
      sub: 'a × b FRA, in months · the reference rate is set at a for a loan from a to b · settlement is at a, so the interest difference is discounted from b · before a, value at t by discounting from b to t · hover a marker',
      h3: 'FRA timeline', hint: 'Accrual period = (b − a)/12 · at a: discount at the rate just set, over b − a · at t < a: use today’s forward rate for a to b, and the spot rate from t to b',
      src: 'FRA · TIMELINE · SIMPLE INTEREST THROUGHOUT',
      points: [
        { at: 0, name: '0', note: 'FRA agreed', tip: 'Time 0: the fixed (FRA) rate is set so the FRA is worth 0' },
        { at: 0.22, name: 't', note: 'value today', tip: 'Valuation date t, before a\nvalue = NP × (new FRA rate − old) × (b − a)/12, discounted from b to t', soft: true },
        { at: 0.45, name: 'a', note: 'rate set · settle', tip: 'Expiration a: the reference rate is observed\nthe FRA is settled in cash now' },
        { at: 1, name: 'b', note: 'loan matures', tip: 'b: when the interest on the notional loan would be paid' },
      ],
      brackets: [{ from: 2, to: 3, text: 'underlying loan: (b − a)/12' }],
      flows: [
        { from: 3, to: 2, text: 'discount at the new rate', row: 1 },
        { from: 3, to: 1, text: 'or, before a: discount b → t', row: 2, soft: true },
      ],
    },
    futopt: {
      title: 'An option on futures ends where a futures position begins.',
      sub: 'Option on a futures contract · the option expires at m; exercise delivers a futures position, struck at X, that runs to n · hover a marker',
      h3: 'Option on futures timeline', hint: 'Long call → long futures at X when the futures price at m is above X · long put → short futures at X when it is below X',
      src: 'OPTION ON FUTURES · TIMELINE · BLACK MODEL DISCOUNTS FROM THE OPTION EXPIRY',
      points: [
        { at: 0, name: '0', note: 'option bought', tip: 'Time 0: buy the option for its premium' },
        { at: 0.5, name: 'm', note: 'option expires', tip: 'm: option expiry\nexercise if the futures price F_m is above X (call) or below X (put)\nthe holder gets a futures position at X, plus F_m − X (call) in cash' },
        { at: 1, name: 'n', note: 'futures expires', tip: 'n: the underlying futures contract expires' },
      ],
      brackets: [{ from: 0, to: 1, text: 'option life' }, { from: 1, to: 2, text: 'futures contract' }],
      flows: [],
    },
    swaption: {
      title: 'A swaption is an option today on a swap that starts at expiry.',
      sub: 'Payer swaption · the option expires at m, when the swap starts · if exercised, the holder pays the fixed rate R_X and receives floating on each payment date to n · hover a marker',
      h3: 'Swaption timeline', hint: 'Value = NP × accrual period × PVA × (Black formula on the forward swap rate) · PVA = the sum of discount factors on the swap’s payment dates',
      src: 'SWAPTION · TIMELINE · PAYER = RIGHT TO PAY FIXED, RECEIVER = RIGHT TO RECEIVE FIXED',
      points: [
        { at: 0, name: '0', note: 'bought', tip: 'Time 0: buy the swaption' },
        { at: 0.42, name: 'm', note: 'expiry = swap start', tip: 'm: exercise if the market swap rate is above R_X (payer)\nthe swap starts here' },
        { at: 0.61, name: '', tip: 'Swap payment: pay R_X, receive floating', pay: true },
        { at: 0.8, name: '', tip: 'Swap payment: pay R_X, receive floating', pay: true },
        { at: 1, name: 'n', note: 'swap ends', tip: 'n: last swap payment', pay: true },
      ],
      brackets: [{ from: 0, to: 1, text: 'option life' }, { from: 1, to: 4, text: 'underlying swap' }],
      flows: [],
    },
  };
  const key = new URLSearchParams(location.search).get('view');
  const V = VIEWS[key] || VIEWS.fra;
  ['title', 'sub', 'h3', 'hint', 'src'].forEach((k) => { document.getElementById(k).textContent = V[k]; });
  document.getElementById('chart').setAttribute('aria-label', V.h3 + ': ' + V.points.filter((q) => q.name).map((q) => q.name + ' ' + (q.note || '')).join(', '));

  mount(document.getElementById('chart'), (s, W, H) => {
    const L = 22, R = W - 22, Y = 96, x = (a) => L + a * (R - L);
    el(s, 'line', { x1: L, y1: Y, x2: R, y2: Y, stroke: C.INK, 'stroke-width': 1.4, pathLength: 1, class: 'draw' });

    // Brackets above the axis.
    V.brackets.forEach((b, i) => {
      const x1 = x(V.points[b.from].at), x2 = x(V.points[b.to].at), yb = Y - 34;
      el(s, 'path', { d: `M${x1 + 2} ${yb + 7} L${x1 + 2} ${yb} L${x2 - 2} ${yb} L${x2 - 2} ${yb + 7}`, fill: 'none', stroke: MID, 'stroke-width': 1.1, class: 'fade', style: `animation-delay:${0.3 + i * 0.1}s` });
      label(s, (x1 + x2) / 2, yb - 7, b.text, { size: 10, weight: 700, fill: MID, anchor: 'middle', delay: 0.4 + i * 0.1, maxWidth: x2 - x1 + 10 });
    });

    // Points: a tick, a dot and labels below.
    V.points.forEach((q, i) => {
      const px = x(q.at);
      el(s, 'line', { x1: px, y1: Y - 6, x2: px, y2: Y + 6, stroke: q.soft ? C.SOFT : C.INK, 'stroke-width': 1.2, class: 'fade', style: `animation-delay:${0.2 + i * 0.06}s` });
      const g = el(s, 'circle', { cx: px, cy: Y, r: q.pay ? 3.4 : 4.6, fill: q.soft ? C.PAPER : C.INK, stroke: q.soft ? C.SOFT : C.INK, 'stroke-width': 1.4, class: 'pop', style: `animation-delay:${0.3 + i * 0.06}s`, 'data-tip': q.tip });
      if (q.name) label(s, px, Y + 22, q.name, { size: 12, anchor: 'middle', fill: q.soft ? MID : C.INK, delay: 0.5 });
      if (q.note) {
        // Wrap each caption to the room between its neighbours.
        const last = V.points.length - 1;
        const prev = i > 0 ? px - x(V.points[i - 1].at) : Infinity, next = i < last ? x(V.points[i + 1].at) - px : Infinity;
        const room = i === 0 ? next - 8 : i === last ? prev - 8 : 2 * Math.min(prev, next) - 8;
        label(s, px, Y + 37, q.note, { size: 9.5, weight: 600, fill: C.MUTED, anchor: i === 0 ? 'start' : i === last ? 'end' : 'middle', delay: 0.55, maxWidth: Math.min(room, 130) });
      }
    });

    // Discounting flows below the axis: from a later point back to an earlier one.
    V.flows.forEach((f, i) => {
      // Start below the captions, so the arrows never cross the point labels.
      const x1 = x(V.points[f.from].at), x2 = x(V.points[f.to].at), yb = Y + 76 + (f.row - 1) * 26;
      arrow(s, [[x1, Y + 58], [x1, yb], [x2, yb], [x2, Y + 60]], { stroke: f.soft ? C.SOFT : C.INK, width: 1.2, head: 5, delay: 0.8 + i * 0.15 });
      label(s, (x1 + x2) / 2, yb - 5, f.text, { size: 10, weight: 700, fill: f.soft ? MID : C.INK, anchor: 'middle', delay: 0.9 + i * 0.15 });
    });
  }, () => (V.flows.length ? 214 : 160));
})();
  </script>
</body>
</html>
