<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Portfolio balance approach</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root{--paper:#F0EFEB;--ink:#1C1C1A;--muted:#6A6963;--soft:#A8A7A0;--grid:#D8D6CE;--faint:#E3E2DB}
    *{margin:0;padding:0;box-sizing:border-box}
    body{background:var(--paper);color:var(--ink);font-family:'Inter',ui-sans-serif,system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
    .card{padding:28px 28px 16px;border-radius:24px;overflow:hidden}
    h2{max-width:820px;margin:0;font-size:clamp(22px,3.4vw,34px);font-weight:700;line-height:1.08;letter-spacing:-.03em}
    .sub{margin:10px 0 16px;color:var(--muted);font-size:12px;line-height:1.55;max-width:760px}
    svg{display:block;width:100%;height:auto;overflow:visible}
    svg text{font-family:'Inter',ui-sans-serif,system-ui,sans-serif}
    .src{margin-top:12px;color:#8A8983;font-size:9px;font-weight:700;letter-spacing:.14em;text-transform:uppercase}
    .draw{stroke-dasharray:1;stroke-dashoffset:1;animation:draw .85s cubic-bezier(.25,.9,.35,1) both}
    .pop{opacity:0;transform-box:fill-box;transform-origin:center;animation:pop .4s cubic-bezier(.25,.9,.35,1) both}
    .fade{opacity:0;animation:fade .5s ease both}
    @keyframes draw{to{stroke-dashoffset:0}}
    @keyframes pop{to{opacity:1;transform:none}}
    @keyframes fade{to{opacity:1}}
    @media(max-width:640px){
      .card{padding:22px 14px 12px}
      h2{font-size:22px}
      .sub{font-size:11px}
    }
    @media(prefers-reduced-motion:reduce){
      .draw{stroke-dashoffset:0;animation:none}
      .pop,.fade{opacity:1;transform:none;animation:none}
    }
  </style>
  <script src="chart-fx.js"></script>
</head>
<body>
  <main class="card" id="card">
    <h2>Fiscal expansion: appreciate first, depreciate later.</h2>
    <div class="sub">Short-run Mundell–Fleming vs long-run portfolio balance · debt supply, risk premium, and monetization risk</div>
    <svg id="chart" viewBox="0 0 860 344" role="img" aria-label="Portfolio balance approach flowchart"></svg>
    <div class="src">PORTFOLIO BALANCE APPROACH · TREND LINEAGE · FISCAL EXPANSION PATHS</div>
  </main>
  <script src="i18n.js"></script>
  <script>
chartI18n.use({
  zh: {

    'Fiscal expansion: appreciate first, depreciate later.': '财政扩张：先升值，后贬值。',

    'Expansionary Fiscal Policy': '扩张性财政政策',
    'Increase in Real Interest Rate Differential': '实际利差上升',

    'SHORT-RUN RESPONSE · MUNDELL–FLEMING': '短期反应 · 蒙代尔–弗莱明',

    'direct effect': '直接效应',
    'PORTFOLIO BALANCE APPROACH · TREND LINEAGE · FISCAL EXPANSION PATHS': '资产组合平衡法 · 趋势谱系 · 财政扩张路径',
  },
  ja: {
    'Portfolio balance approach': 'ポートフォリオ・バランス・アプローチ',
    'Fiscal expansion: appreciate first, depreciate later.': '財政拡張：まず通貨高、のち通貨安。',
    'Short-run Mundell–Fleming vs long-run portfolio balance · debt supply, risk premium, and monetization risk': '短期マンデル＝フレミング vs 長期ポートフォリオ・バランス · 債務供給、リスクプレミアム、マネタイズ・リスク',
    'Expansionary Fiscal Policy': '拡張的財政政策',
    'Increase in Real Interest Rate Differential': '実質金利差の拡大',
    'Currency Appreciates': '通貨高',
    'Government Debt Buildup': '政府債務の蓄積',
    'Central Bank Monetizes Debt': '中央銀行が債務をマネタイズ',
    'Fiscal Stance Turns Restrictive': '財政スタンスが引き締めへ',
    'Currency Depreciates': '通貨安',
    'SHORT-RUN RESPONSE · MUNDELL–FLEMING': '短期反応 · マンデル＝フレミング',
    'LONG-RUN RESPONSE · PORTFOLIO BALANCE APPROACH': '長期反応 · ポートフォリオ・バランス・アプローチ',
    'direct effect': '直接効果',
    'PORTFOLIO BALANCE APPROACH · TREND LINEAGE · FISCAL EXPANSION PATHS': 'ポートフォリオ・バランス・アプローチ · トレンド系譜 · 財政拡張の経路',
  },
  fr: {
    'Portfolio balance approach': 'Approche de portefeuille',
    'Fiscal expansion: appreciate first, depreciate later.': 'Expansion budgétaire : apprécier d’abord, déprécier ensuite.',
    'Short-run Mundell–Fleming vs long-run portfolio balance · debt supply, risk premium, and monetization risk': 'Court terme Mundell–Fleming vs long terme portefeuille · offre de dette, prime de risque et risque de monétisation',
    'Expansionary Fiscal Policy': 'Politique budgétaire expansionniste',
    'Increase in Real Interest Rate Differential': 'Hausse du différentiel de taux réel',
    'Currency Appreciates': 'Appréciation de la devise',
    'Government Debt Buildup': 'Accumulation de dette publique',
    'Central Bank Monetizes Debt': 'La banque centrale monétise la dette',
    'Fiscal Stance Turns Restrictive': 'La politique budgétaire devient restrictive',
    'Currency Depreciates': 'Dépréciation de la devise',
    'SHORT-RUN RESPONSE · MUNDELL–FLEMING': 'RÉPONSE DE COURT TERME · MUNDELL–FLEMING',
    'LONG-RUN RESPONSE · PORTFOLIO BALANCE APPROACH': 'RÉPONSE DE LONG TERME · APPROCHE DE PORTEFEUILLE',
    'direct effect': 'effet direct',
    'PORTFOLIO BALANCE APPROACH · TREND LINEAGE · FISCAL EXPANSION PATHS': 'APPROCHE DE PORTEFEUILLE · LIGNAGE · CHEMINS D’EXPANSION BUDGÉTAIRE',

  </script>
  <script>
    const NS='http://www.w3.org/2000/svg';
    const INK='#1C1C1A', PAPER='#F0EFEB', MUTED='#6A6963', SOFT='#A8A7A0', GRID='#D8D6CE', FAINT='#E3E2DB';
    const svg=document.querySelector('#chart');

    function el(tag, a={}, content=''){
      const n=document.createElementNS(NS, tag);
      Object.entries(a).forEach(([k,v])=>n.setAttribute(k,v));
      if(content!=='') n.textContent=content;
      svg.append(n);
      return n;
    }
    function arrow(x1,y1,x2,y2,{delay=0,stroke=GRID,sw=1.25,edge}={}){
      const d=`M${x1} ${y1} L${x2} ${y2}`;
      el('path',{d,fill:'none',stroke, 'stroke-width':sw, pathLength:1, class:'draw', style:`animation-delay:${delay}s`, 'data-edge':edge});
      // small arrowhead
      const ang=Math.atan2(y2-y1,x2-x1);
      const ah=6;
      const p1=[x2-ah*Math.cos(ang-0.45), y2-ah*Math.sin(ang-0.45)];
      const p2=[x2-ah*Math.cos(ang+0.45), y2-ah*Math.sin(ang+0.45)];
      el('path',{d:`M${x2} ${y2} L${p1[0]} ${p1[1]} M${x2} ${y2} L${p2[0]} ${p2[1]}`, fill:'none', stroke, 'stroke-width':sw, 'stroke-linecap':'round', class:'draw', style:`animation-delay:${delay+.15}s`, 'data-edge':edge});
    }
    function label(x,y,s,{delay=0,anchor='start',fs=9,fill=MUTED,weight=700,ls='.06em'}={}){
      el('text',{x,y,fill,'text-anchor':anchor,'font-size':fs,'font-weight':weight,'letter-spacing':ls,class:'fade',style:`animation-delay:${delay}s`},s);
    }
    function polyline(pts,{delay=0,stroke=GRID,sw=1.25,head=true,edge}={}){
      let d='';
      pts.forEach((p,i)=>{d+=(i?'L':'M')+p[0]+' '+p[1]+' ';});
      el('path',{d:d.trim(),fill:'none',stroke,'stroke-width':sw,pathLength:1,class:'draw',style:`animation-delay:${delay}s`,'data-edge':edge});
      if(head && pts.length>=2){
        const a=pts[pts.length-2], b=pts[pts.length-1];
        const ang=Math.atan2(b[1]-a[1],b[0]-a[0]);
        const ah=6;
        const p1=[b[0]-ah*Math.cos(ang-0.45), b[1]-ah*Math.sin(ang-0.45)];
        const p2=[b[0]-ah*Math.cos(ang+0.45), b[1]-ah*Math.sin(ang+0.45)];
        el('path',{d:`M${b[0]} ${b[1]} L${p1[0]} ${p1[1]} M${b[0]} ${b[1]} L${p2[0]} ${p2[1]}`,fill:'none',stroke,'stroke-width':sw,'stroke-linecap':'round',class:'draw',style:`animation-delay:${delay+.15}s`,'data-edge':edge});
      }
    }

    const T=(s)=>(window.chartI18n?chartI18n.t(s):s);
    const CJK=/[぀-ヿ㐀-鿿]/;
    // Wrap a translated label to the box width. Latin text breaks at spaces;
    // CJK text has none, so it breaks between characters.
    function fitLines(label,width,fs){
      const charW=(c)=>CJK.test(c)?fs:fs*.6;
      const textW=(s)=>[...s].reduce((n,c)=>n+charW(c),0);
      const tokens=CJK.test(label)&&!label.includes(' ')?[...label]:label.split(/\s+/);
      const sep=CJK.test(label)&&!label.includes(' ')?'':' ';
      const lines=[];let cur='';
      tokens.forEach((tok)=>{const next=cur?cur+sep+tok:tok;if(textW(next)>width&&cur){lines.push(cur);cur=tok}else cur=next});
      if(cur)lines.push(cur);
      // Balance CJK lines so a single character is never left on its own line.
      if(!sep&&lines.length>1){const per=Math.ceil(tokens.length/lines.length);return lines.map((_,i)=>tokens.slice(i*per,(i+1)*per).join('')).filter(Boolean)}
      return lines;
    }
    // What each step means; hovering a step lights its arrows and the steps they join.
    const TIPS={
      'Expansionary Fiscal Policy':'more government spending or lower taxes',
      'Increase in Real Interest Rate Differential':'government borrowing lifts domestic real rates above foreign ones',
      'Currency Appreciates':'short run: capital flows in for the higher return',
      'Government Debt Buildup':'investors must hold ever more of the country\'s bonds',
      'Central Bank Monetizes Debt':'printing money to buy the debt weakens the currency',
      'Fiscal Stance Turns Restrictive':'the government reverses course to contain the debt',
      'Currency Depreciates':'long run: holders want a lower price, or a higher return, for the extra debt',
    };
    const KEY=(label)=>label.toLowerCase().replace(/[^a-z]+/g,'-');
    function node(b,label,{dark=false,delay=0,fs=12.5}={}){
      const hover={'data-node':KEY(label),'data-tip':`${T(label)}\n${T(TIPS[label]||'')}`};
      el('rect',{x:b.x,y:b.y,width:b.w,height:b.h,rx:12,fill:dark?INK:FAINT,class:'pop',style:`animation-delay:${delay}s`,...hover});
      const lines=fitLines(T(label),b.w-18,fs),lh=fs+3;
      const start=b.y+b.h/2-((lines.length-1)*lh)/2+fs*.36;
      lines.forEach((ln,i)=>el('text',{x:b.x+b.w/2,y:start+i*lh,fill:dark?PAPER:INK,'text-anchor':'middle','font-size':fs,'font-weight':800,class:'fade',style:`animation-delay:${delay+.08}s`,...hover},ln));
    }
    const E=(a,b)=>`${KEY(a)}>${KEY(b)}`;
    const N={root:'Expansionary Fiscal Policy',rate:'Increase in Real Interest Rate Differential',up:'Currency Appreciates',debt:'Government Debt Buildup',mon:'Central Bank Monetizes Debt',rest:'Fiscal Stance Turns Restrictive',down:'Currency Depreciates'};
    const edge=(a,b)=>E(N[a],N[b]);
    const lane=(x,y,s,delay,fs=10)=>label(x,y,T(s),{delay,fs,fill:INK,weight:800,ls:'.08em'});
    const cy=(b)=>b.y+b.h/2, right=(b)=>b.x+b.w;
    const ROAD={stroke:SOFT,sw:1.35}, BRANCH={stroke:GRID,sw:1.25};

    function wide(){
      svg.setAttribute('viewBox','0 0 860 344');
      // Outcomes share a right-hand column so the two answers line up.
      const root={x:24,y:212,w:172,h:76}, rate={x:252,y:52,w:226,h:58}, up={x:752,y:52,w:94,h:58};
      const debt={x:252,y:222,w:196,h:56}, mon={x:540,y:162,w:176,h:52}, rest={x:540,y:286,w:176,h:52}, down={x:752,y:205,w:94,h:90};
      lane(252,36,'SHORT-RUN RESPONSE · MUNDELL–FLEMING',.05);
      lane(252,150,'LONG-RUN RESPONSE · PORTFOLIO BALANCE APPROACH',.12);
      node(root,'Expansionary Fiscal Policy',{dark:true,delay:.05,fs:13.5});
      node(rate,'Increase in Real Interest Rate Differential',{delay:.2});
      node(up,'Currency Appreciates',{dark:true,delay:.35});
      node(debt,'Government Debt Buildup',{delay:.22,fs:13});
      node(mon,'Central Bank Monetizes Debt',{delay:.38});
      node(rest,'Fiscal Stance Turns Restrictive',{delay:.42});
      node(down,'Currency Depreciates',{dark:true,delay:.55});
      polyline([[right(root),cy(root)],[224,cy(root)],[224,cy(rate)],[rate.x,cy(rate)]],{delay:.1,...ROAD,edge:edge('root','rate')});
      arrow(right(rate),cy(rate),up.x,cy(up),{delay:.26,...ROAD,edge:edge('rate','up')});
      arrow(right(root),cy(root),debt.x,cy(debt),{delay:.16,...ROAD,edge:edge('root','debt')});
      const jx=500;
      polyline([[right(debt),cy(debt)],[jx,cy(debt)],[jx,cy(mon)],[mon.x,cy(mon)]],{delay:.3,...BRANCH,edge:edge('debt','mon')});
      polyline([[jx,cy(debt)],[jx,cy(rest)],[rest.x,cy(rest)]],{delay:.34,...BRANCH,edge:edge('debt','rest')});
      arrow(right(debt),cy(debt),down.x,cy(down),{delay:.38,...ROAD,edge:edge('debt','down')});
      label(628,cy(debt)-8,T('direct effect'),{delay:.4,fs:10.5,fill:MUTED,weight:600,ls:'.04em',anchor:'middle'});
      polyline([[right(mon),cy(mon)],[734,cy(mon)],[734,cy(down)-20],[down.x,cy(down)-20]],{delay:.46,...BRANCH,edge:edge('mon','down')});
      polyline([[right(rest),cy(rest)],[734,cy(rest)],[734,cy(down)+20],[down.x,cy(down)+20]],{delay:.5,...BRANCH,edge:edge('rest','down')});
    }

    function narrow(){
      svg.setAttribute('viewBox','0 0 360 408');
      // One column read top to bottom; a left rail feeds both responses.
      const root={x:24,y:6,w:312,h:42}, rate={x:24,y:96,w:176,h:56}, up={x:222,y:96,w:114,h:56};
      const debt={x:24,y:200,w:200,h:50}, mon={x:24,y:280,w:148,h:52}, rest={x:188,y:280,w:126,h:52}, down={x:24,y:360,w:290,h:44};
      lane(24,86,'SHORT-RUN RESPONSE · MUNDELL–FLEMING',.05,9);
      lane(24,190,'LONG-RUN RESPONSE · PORTFOLIO BALANCE APPROACH',.12,9);
      node(root,'Expansionary Fiscal Policy',{dark:true,delay:.05,fs:11.5});
      node(rate,'Increase in Real Interest Rate Differential',{delay:.2,fs:10.5});
      node(up,'Currency Appreciates',{dark:true,delay:.35,fs:10.5});
      node(debt,'Government Debt Buildup',{delay:.22,fs:10.5});
      node(mon,'Central Bank Monetizes Debt',{delay:.38,fs:10.5});
      node(rest,'Fiscal Stance Turns Restrictive',{delay:.42,fs:10.5});
      node(down,'Currency Depreciates',{dark:true,delay:.55,fs:11});
      polyline([[root.x,cy(root)],[10,cy(root)],[10,cy(rate)],[rate.x,cy(rate)]],{delay:.1,...ROAD,edge:edge('root','rate')});
      polyline([[10,cy(rate)],[10,cy(debt)],[debt.x,cy(debt)]],{delay:.16,...ROAD,edge:edge('root','debt')});
      arrow(right(rate),cy(rate),up.x,cy(up),{delay:.26,...ROAD,edge:edge('rate','up')});
      const mx=mon.x+mon.w/2, rx=rest.x+rest.w/2, jy=266;
      polyline([[mx,debt.y+debt.h],[mx,mon.y]],{delay:.3,...BRANCH,edge:edge('debt','mon')});
      polyline([[mx,jy],[rx,jy],[rx,rest.y]],{delay:.34,...BRANCH,edge:edge('debt','rest')});
      arrow(mx,mon.y+mon.h,mx,down.y,{delay:.46,...BRANCH,edge:edge('mon','down')});
      arrow(rx,rest.y+rest.h,rx,down.y,{delay:.5,...BRANCH,edge:edge('rest','down')});
      polyline([[right(debt),cy(debt)],[346,cy(debt)],[346,cy(down)],[right(down),cy(down)]],{delay:.38,...ROAD,edge:edge('debt','down')});
      label(286,cy(debt)-7,T('direct effect'),{delay:.4,fs:9,fill:MUTED,weight:600,ls:'.04em',anchor:'middle'});
    }

    let layout=null;
    function render(force){
      const small=svg.getBoundingClientRect().width<560;
      if(!force&&small===layout)return;
      layout=small;svg.innerHTML='';
      (small?narrow:wide)();
      if(parent!==window)parent.postMessage({chartHeight:document.querySelector('#card').scrollHeight},location.origin);
    }

    render(true);
    document.querySelector('#card').addEventListener('click',()=>render(true));
    window.addEventListener('resize',()=>render(false));
    document.fonts?.ready.then(()=>render(true));
  </script>
</body>
