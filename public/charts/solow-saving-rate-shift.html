<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Higher saving lifts the steady-state levels</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root{--paper:#F0EFEB;--ink:#1C1C1A;--muted:#8F8E88;--faint:#C6C5BF;--grid:#DEDDD6}
    *{margin:0;padding:0;box-sizing:border-box}
    body{background:var(--paper);color:var(--ink);font-family:'Inter',ui-sans-serif,system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
    .card{padding:28px 28px 18px;border-radius:24px;overflow:hidden}
    h2{max-width:820px;margin:0;font-size:clamp(22px,3.6vw,36px);font-weight:700;line-height:1.08;letter-spacing:-.03em}
    .sub{margin:10px 0 18px;color:var(--muted);font-size:12px;line-height:1.55;max-width:760px}
    .panel{background:var(--paper);border:1px solid var(--grid);border-radius:18px;padding:14px 12px 8px;min-width:0}
    .panel h3{margin:0 0 2px;font-size:13px;font-weight:700;letter-spacing:-.01em}
    .panel .hint{margin:0 0 6px;font-size:10px;color:var(--muted);line-height:1.4}
    svg{display:block;width:100%;height:auto}
    svg text{font-family:'Inter',ui-sans-serif,system-ui,sans-serif}
    .src{margin-top:14px;color:#8A8983;font-size:9px;font-weight:700;letter-spacing:.14em;text-transform:uppercase}
    .draw{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.15s cubic-bezier(.4,0,.2,1) both}
    .pop{transform-box:fill-box;transform-origin:center;animation:pop .45s cubic-bezier(.2,.7,.3,1.3) both}
    .fade{animation:fade .8s ease both}
    @keyframes draw{to{stroke-dashoffset:0}}
    @keyframes pop{from{transform:scale(0)}to{transform:none}}
    @keyframes fade{from{opacity:0}}
    @media(max-width:640px){
      .card{padding:22px 14px 14px}
      h2{font-size:24px}
      .panel svg{max-width:520px;margin:0 auto}
    }
    @media(prefers-reduced-motion:reduce){
      .draw{stroke-dashoffset:0;animation:none}
      .pop,.fade{opacity:1;transform:none;animation:none}
    }
  </style>
</head>
<body>

    <h2>Higher saving lifts the steady-state levels.</h2>
    <div class="sub">s↑ shifts sy = sAk<sup>α</sup> up · ray fixed · A→B raises k* and y* · long-run growth rate unchanged</div>
    <section class="panel">
      <h3>Saving-rate shift</h3>
      <div class="hint">Gray = s₁f(k) · ink = s₂f(k) · ray = required investment · A→B = higher steady state</div>
      <svg id="solow-s" viewBox="0 0 560 340" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Increase in saving rate shifts steady state"></svg>
    </section>
    <div class="src">SOLOW SAVING-RATE SHIFT · F2 HAIRLINE LINE · s↑ → k*, y*</div>
  </main>

  <script>
(() => {
  const INK = '#1C1C1A', PAPER = '#F0EFEB', MUTED = '#8F8E88', GRID = '#DEDDD6', FAINT = '#C6C5BF';
  const NS = 'http://www.w3.org/2000/svg';
  const T = (s) => (window.chartI18n ? chartI18n.t(s) : s);
  const el = (p, t, a) => {
    const n = document.createElementNS(NS, t);
    for (const k in a) n.setAttribute(k, a[k]);
    p.appendChild(n);
    return n;
  };
  const txt = (p, a, s) => { const n = el(p, 'text', a); n.textContent = s; return n; };
  const tip = (n, s) => { const t = document.createElementNS(NS, 'title'); t.textContent = s; n.appendChild(t); };

  // Illustrative Solow parameters (α ≈ 1/3 concavity)
  const ALPHA = 0.33;
  const A_TFP = 1.2;
  const S1 = 0.22;
  const S2 = 0.42;
  const PHI = 0.15; // δ + n + θ/(1−α)
  const syOf = (k, s) => s * A_TFP * Math.pow(k, ALPHA);
  const rayOf = (k) => PHI * k;
  // Steady-state: s A k^α = φ k  ⇒  k* = (s A / φ)^(1/(1−α))
  const kA = Math.pow((S1 * A_TFP) / PHI, 1 / (1 - ALPHA));
  const kB = Math.pow((S2 * A_TFP) / PHI, 1 / (1 - ALPHA));
  const yA = syOf(kA, S1); // = φ kA (height on savings/investment chart)
  const yB = syOf(kB, S2);

  const K_MIN = 0.05, K_MAX = Math.max(kB * 1.35, 8.5);
  const N = 56;
  const ks = Array.from({ length: N }, (_, i) => K_MIN + (i / (N - 1)) * (K_MAX - K_MIN));

  function obsReveal(id, fn) {
    const n = document.getElementById(id);
    const go = () => { n.innerHTML = ''; fn(n); };
    const io = new IntersectionObserver((es) => {
      if (es[0].isIntersecting) { go(); io.disconnect(); }
    }, { threshold: .25 });
    io.observe(n);
    n.style.cursor = 'pointer';
    n.addEventListener('click', go);
  }

  function arrowHead(s, x1, y1, x2, y2, stroke, delay) {
    const ang = Math.atan2(y2 - y1, x2 - x1);
    const len = 7;
    const a1 = ang + Math.PI * .82, a2 = ang - Math.PI * .82;
    el(s, 'line', {
      x1: x2, y1: y2, x2: x2 + len * Math.cos(a1), y2: y2 + len * Math.sin(a1),
      stroke, 'stroke-width': 1.15, 'stroke-linecap': 'round',
      class: 'fade', style: `animation-delay:${delay}s`
    });
    el(s, 'line', {
      x1: x2, y1: y2, x2: x2 + len * Math.cos(a2), y2: y2 + len * Math.sin(a2),
      stroke, 'stroke-width': 1.15, 'stroke-linecap': 'round',
      class: 'fade', style: `animation-delay:${delay}s`
    });
  }

  function drawSolowS(s) {
    const X0 = 58, X1 = 520, TOP = 42, BASE = 268;
    const vMax = Math.max(syOf(K_MAX, S2), rayOf(K_MAX), yB) * 1.12;
    const x = (k) => X0 + ((k - K_MIN) / (K_MAX - K_MIN)) * (X1 - X0);
    const mapY = (v) => BASE - (v / vMax) * (BASE - TOP);

    // axes
    el(s, 'line', { x1: X0, y1: BASE, x2: X1 + 4, y2: BASE, stroke: GRID, 'stroke-width': .8, class: 'fade' });
    el(s, 'line', { x1: X0, y1: BASE, x2: X0, y2: TOP - 6, stroke: GRID, 'stroke-width': .8, class: 'fade' });

    // faint ticks
    ks.forEach((k, i) => {
      if (i % 4 !== 0) return;
      el(s, 'line', {
        x1: x(k), y1: BASE, x2: x(k), y2: BASE - 5,
        stroke: '#CFCEC7', 'stroke-width': .55,
        class: 'fade', style: `animation-delay:${i * .004}s`
      });
    });

    // required investment ray (muted)
    const ptsRay = ks.map((k) => `${x(k)} ${mapY(rayOf(k))}`).join(' L ');
    el(s, 'path', {
      d: 'M' + ptsRay, fill: 'none', stroke: MUTED, 'stroke-width': 1.25, pathLength: 1,
      class: 'draw', style: 'animation-duration:1.05s'
    });

    // s1 f(k) — lower, solid muted
    const ptsS1 = ks.map((k) => `${x(k)} ${mapY(syOf(k, S1))}`).join(' L ');
    el(s, 'path', {
      d: 'M' + ptsS1, fill: 'none', stroke: MUTED, 'stroke-width': 1.3, pathLength: 1,
      class: 'draw', style: 'animation-duration:1.15s;animation-delay:.04s'
    });

    // s2 f(k) — higher, ink (solid but can read as second weight; light dash overlay feel via thinner marks)
    const ptsS2 = ks.map((k) => `${x(k)} ${mapY(syOf(k, S2))}`).join(' L ');
    el(s, 'path', {
      d: 'M' + ptsS2, fill: 'none', stroke: INK, 'stroke-width': 1.45, pathLength: 1,
      class: 'draw', style: 'animation-duration:1.2s;animation-delay:.1s'
    });

    // sparse dots on both curves
    ks.forEach((k, i) => {
      if (i % 4 !== 0 && i !== N - 1) return;
      el(s, 'circle', {
        cx: x(k), cy: mapY(syOf(k, S1)), r: 1.4, fill: MUTED,
        class: 'pop', style: `animation-delay:${.1 + i * .01}s`
      });
      el(s, 'circle', {
        cx: x(k), cy: mapY(syOf(k, S2)), r: 1.55, fill: INK,
        class: 'pop', style: `animation-delay:${.14 + i * .01}s`
      });
    });

    // dashed guides for A and B
    const xA = x(kA), yAmap = mapY(yA);
    const xB = x(kB), yBmap = mapY(yB);
    [
      [xA, yAmap],
      [xB, yBmap],
    ].forEach(([xv, yv], i) => {
      el(s, 'line', {
        x1: xv, y1: yv, x2: xv, y2: BASE,
        stroke: FAINT, 'stroke-width': .95, 'stroke-dasharray': '3 2.5',
        class: 'fade', style: `animation-delay:${.4 + i * .06}s`
      });
      el(s, 'line', {
        x1: X0, y1: yv, x2: xv, y2: yv,
        stroke: FAINT, 'stroke-width': .95, 'stroke-dasharray': '3 2.5',
        class: 'fade', style: `animation-delay:${.45 + i * .06}s`
      });
    });

    // steady-state dots A (muted) and B (ink)
    const cA = el(s, 'circle', {
      cx: xA, cy: yAmap, r: 5, fill: MUTED,
      class: 'pop', style: 'animation-delay:.7s'
    });
    tip(cA, `A: k_A=${kA.toFixed(2)}, y_A=${yA.toFixed(2)}`);
    const cB = el(s, 'circle', {
      cx: xB, cy: yBmap, r: 5.2, fill: INK,
      class: 'pop', style: 'animation-delay:.82s'
    });
    tip(cB, `B: k_B=${kB.toFixed(2)}, y_B=${yB.toFixed(2)}`);

    txt(s, {
      x: xA - 10, y: yAmap - 12,
      'font-size': 13, 'font-weight': 800, fill: MUTED,
      'text-anchor': 'end',
      style: `paint-order:stroke;stroke:${PAPER};stroke-width:3.5px;animation-delay:.78s`,
      class: 'fade'
    }, T('A'));
    txt(s, {
      x: xB + 10, y: yBmap - 12,
      'font-size': 13, 'font-weight': 800, fill: INK,
      'text-anchor': 'start',
      style: `paint-order:stroke;stroke:${PAPER};stroke-width:3.5px;animation-delay:.9s`,
      class: 'fade'
    }, T('B'));

    // axis tick labels
    txt(s, {
      x: xA, y: BASE + 16, 'font-size': 11, 'font-weight': 800, fill: MUTED,
      'text-anchor': 'middle', class: 'fade', style: 'animation-delay:.55s'
    }, T('k_A'));
    txt(s, {
      x: xB, y: BASE + 16, 'font-size': 11, 'font-weight': 800, fill: INK,
      'text-anchor': 'middle', class: 'fade', style: 'animation-delay:.6s'
    }, T('k_B'));
    txt(s, {
      x: X0 - 8, y: yAmap + 4, 'font-size': 11, 'font-weight': 800, fill: MUTED,
      'text-anchor': 'end', class: 'fade', style: 'animation-delay:.55s'
    }, T('y_A'));
    txt(s, {
      x: X0 - 8, y: yBmap + 4, 'font-size': 11, 'font-weight': 800, fill: INK,
      'text-anchor': 'end', class: 'fade', style: 'animation-delay:.62s'
    }, T('y_B'));

    // curve labels
    const kLabS1 = K_MAX * 0.55;
    txt(s, {
      x: x(kLabS1), y: mapY(syOf(kLabS1, S1)) + 18,
      'font-size': 11, 'font-weight': 800, fill: MUTED,
      'text-anchor': 'middle',
      style: `paint-order:stroke;stroke:${PAPER};stroke-width:3.5px;animation-delay:.65s`,
      class: 'fade'
    }, T('s₁ f(k)'));

    const kLabS2 = K_MAX * 0.72;
    txt(s, {
      x: x(kLabS2), y: mapY(syOf(kLabS2, S2)) - 12,
      'font-size': 11, 'font-weight': 800, fill: INK,
      'text-anchor': 'middle',
      style: `paint-order:stroke;stroke:${PAPER};stroke-width:3.5px;animation-delay:.72s`,
      class: 'fade'
    }, T('s₂ f(k)'));

    const kLabRay = K_MAX * 0.88;
    txt(s, {
      x: x(kLabRay) - 4, y: mapY(rayOf(kLabRay)) + 18,
      'font-size': 10, 'font-weight': 700, fill: MUTED,
      'text-anchor': 'end',
      style: `paint-order:stroke;stroke:${PAPER};stroke-width:3px;animation-delay:.75s`,
      class: 'fade'
    }, T('[δ + n + θ/(1−α)]k'));

    // upward s↑ arrow between the two curves (at mid-k between A and B)
    const kMid = (kA + kB) * 0.48;
    const uy1 = mapY(syOf(kMid, S1)) - 4;
    const uy2 = mapY(syOf(kMid, S2)) + 4;
    const ux = x(kMid);
    el(s, 'line', {
      x1: ux, y1: uy1, x2: ux, y2: uy2,
      stroke: INK, 'stroke-width': 1.25,
      class: 'fade', style: 'animation-delay:.95s'
    });
    arrowHead(s, ux, uy1, ux, uy2, INK, 1.0);
    txt(s, {
      x: ux + 10, y: (uy1 + uy2) / 2 + 4,
      'font-size': 12, 'font-weight': 800, fill: INK,
      'text-anchor': 'start',
      style: `paint-order:stroke;stroke:${PAPER};stroke-width:3.5px;animation-delay:1.05s`,
      class: 'fade'
    }, T('s↑'));

    // k_A → k_B arrow along axis
    const ax1 = xA + 14, ax2 = xB - 14;
    const ay = BASE + 28;
    el(s, 'line', {
      x1: ax1, y1: ay, x2: ax2, y2: ay,
      stroke: MUTED, 'stroke-width': 1.1,
      class: 'fade', style: 'animation-delay:1.1s'
    });
    arrowHead(s, ax1, ay, ax2, ay, MUTED, 1.15);

    // axis titles
    txt(s, {
      x: X1, y: BASE + 42, 'font-size': 9.5, 'font-weight': 600, fill: MUTED,
      'text-anchor': 'end', 'letter-spacing': '.04em', class: 'fade'
    }, T('capital per worker k →'));
    txt(s, {
      x: X0 - 4, y: TOP - 2, 'font-size': 9.5, 'font-weight': 600, fill: MUTED,
      'text-anchor': 'start', class: 'fade'
    }, T('output per worker y'));
  }

  function localizeDom() {
    document.title = T('Higher saving lifts the steady-state levels');
    document.querySelector('h2').textContent = T('Higher saving lifts the steady-state levels.');
    document.querySelector('.sub').innerHTML = T('s↑ shifts sy = sAkα up · ray fixed · A→B raises k* and y* · long-run growth rate unchanged')
      .replace('sAkα', 'sAk<sup>α</sup>');
    const panel = document.querySelector('.panel');
    panel.querySelector('h3').textContent = T('Saving-rate shift');
    panel.querySelector('.hint').textContent = T('Gray = s₁f(k) · ink = s₂f(k) · ray = required investment · A→B = higher steady state');
    panel.querySelector('svg').setAttribute('aria-label', T('Higher saving lifts the steady-state levels'));
    document.querySelector('.src').textContent = T('SOLOW SAVING-RATE SHIFT · F2 HAIRLINE LINE · s↑ → k*, y*');
  }

  localizeDom();
  obsReveal('solow-s', drawSolowS);

  function fit() {
    if (parent !== window) {
      parent.postMessage({ chartHeight: document.querySelector('.card').scrollHeight }, location.origin);
    }
  }
  window.addEventListener('resize', fit);
  document.fonts?.ready.then(fit);
  setTimeout(fit, 100);
  fit();
})();
  </script>
</body>
