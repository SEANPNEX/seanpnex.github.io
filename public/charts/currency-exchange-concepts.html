<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Currency-exchange concepts</title>
  <style>
    :root{--paper:#F0EFEB;--ink:#1C1C1A;--muted:#6A6963;--soft:#A8A7A0;--grid:#D8D6CE;--faint:#E3E2DB}
    *{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,sans-serif}.card{min-height:460px;padding:29px 30px 18px;border-radius:24px;overflow:hidden}h2{max-width:760px;margin:0;font-size:clamp(25px,4vw,42px);font-weight:700;line-height:1.05;letter-spacing:-.035em}.sub{margin:10px 0 7px;color:var(--muted);font-size:12px;line-height:1.5}svg{display:block;width:100%;height:315px}.src{color:#8A8983;font-size:9px;font-weight:700;letter-spacing:.14em;text-transform:uppercase}.draw{stroke-dasharray:1;stroke-dashoffset:1;animation:draw .7s cubic-bezier(.25,.9,.35,1) forwards}.pop{opacity:0;transform-box:fill-box;transform-origin:center;animation:pop .4s cubic-bezier(.25,.9,.35,1) forwards}.fade{opacity:0;animation:fade .45s ease forwards}@keyframes draw{to{stroke-dashoffset:0}}@keyframes pop{to{opacity:1;transform:scale(1)}}@keyframes fade{to{opacity:1}}@media(max-width:600px){.card{padding:24px 15px 15px}.sub{font-size:11px}svg{height:355px}}@media(prefers-reduced-motion:reduce){.draw{stroke-dashoffset:0;animation:none}.pop,.fade{opacity:1;transform:none;animation:none}}
  </style>
</head>
<body>
  <main class="card" id="card"><h2 id="title"></h2><div class="sub" id="sub"></div><svg id="chart" viewBox="0 0 760 315" role="img"></svg><div class="src" id="src"></div></main>
  <script>
    const NS='http://www.w3.org/2000/svg',INK='#1C1C1A',PAPER='#F0EFEB',MUTED='#6A6963',SOFT='#A8A7A0',GRID='#D8D6CE',FAINT='#E3E2DB';
    const svg=document.querySelector('#chart');
    const el=(tag,a={},content='')=>{const n=document.createElementNS(NS,tag);Object.entries(a).forEach(([k,v])=>n.setAttribute(k,v));if(content)n.textContent=content;svg.append(n);return n};
    const txt=(x,y,s,a={})=>el('text',{x,y,fill:MUTED,'font-size':10,'font-weight':600,...a},s);
    const dot=(x,y,r=7,a={})=>el('circle',{cx:x,cy:y,r,fill:INK,class:'pop',...a});
    const path=(d,a={})=>el('path',{d,fill:'none',stroke:SOFT,'stroke-width':.9,pathLength:1,class:'draw',...a});
    const box=(x,y,w,h,label,dark=false)=>{el('rect',{x,y,width:w,height:h,rx:14,fill:dark?INK:FAINT,class:'pop'});txt(x+w/2,y+h/2+4,label,{fill:dark?PAPER:INK,'text-anchor':'middle','font-size':10,'font-weight':800,class:'fade'})};
    const V={
      parity:{title:'Parity conditions connect prices, yields, and currency values.',sub:'each outer node = an observed or expected market quantity · lines converge on exchange-rate consistency',src:'RADIAL CONVERGENCE · L5 MONO-EDITORIAL · PARITY MAP',render(){
        const cx=380,cy=160,R=125,items=[['SPOT',-145],['FORWARD',-85],['NOMINAL RATES',-25],['REAL RATES',35],['EXPECTED INFLATION',95],['PRICE LEVELS',155]];
        items.forEach(([name,deg],i)=>{const a=deg*Math.PI/180,x=cx+R*Math.cos(a),y=cy+R*Math.sin(a),hx=cx+38*Math.cos(a),hy=cy+38*Math.sin(a);path(`M${x} ${y} C${cx+(x-cx)*.45} ${cy+(y-cy)*.45} ${cx+(hx-cx)*.30} ${cy+(hy-cy)*.30} ${hx} ${hy}`,{style:`animation-delay:${i*.08}s`});dot(x,y,3,{fill:MUTED,style:`animation-delay:${i*.08}s`});txt(x,y+(y<cy?-12:18),name,{'text-anchor':'middle','font-size':8,'letter-spacing':'.08em',class:'fade'});dot(hx,hy,8,{style:`animation-delay:${.4+i*.07}s`})});dot(cx,cy,27);txt(cx,cy+4,'FX',{fill:PAPER,'text-anchor':'middle','font-size':12,'font-weight':800,class:'fade'});[['CIRP',305,97],['UIRP',455,96],['PPP',472,225],['FISHER',284,226]].forEach(([s,x,y])=>txt(x,y,s,{fill:INK,'text-anchor':'middle','font-size':9,'font-weight':800,class:'fade'}));
      }},
      policy:{title:'Policy reaches the currency through rates, capital, and trade.',sub:'floating exchange rate · high capital mobility · two short-run transmission paths',src:'TREND LINEAGE · L11 MONO-EDITORIAL · MUNDELL–FLEMING',render(){
        const rows=[{y:92,name:'MONETARY EXPANSION',nodes:['LOWER RATE','CAPITAL OUTFLOW','DEPRECIATION']},{y:215,name:'FISCAL EXPANSION',nodes:['HIGHER RATE','CAPITAL INFLOW','APPRECIATION']}],xs=[285,475,665];
        rows.forEach((r,ri)=>{txt(42,r.y+4,r.name,{fill:INK,'font-size':9,'font-weight':800,'letter-spacing':'.08em'});r.nodes.forEach((name,i)=>{if(i<2)path(`M${xs[i]+62} ${r.y} L${xs[i+1]-62} ${r.y}`,{stroke:GRID,'stroke-width':1.2,style:`animation-delay:${ri*.2+i*.12}s`});box(xs[i]-65,r.y-22,130,44,name,i===2);if(i<2){dot(xs[i]+82,r.y,2,{fill:SOFT,style:`animation-delay:${.25+i*.12}s`})}})});txt(380,292,'REGIME MATTERS · UNDER A FIXED RATE THE CENTRAL BANK MUST DEFEND THE PEG',{'text-anchor':'middle','font-size':8,'letter-spacing':'.1em',class:'fade'});
      }}
    };
    function render(){svg.innerHTML='';const key=new URLSearchParams(location.search).get('view')||'parity',v=V[key]||V.parity;document.querySelector('#title').textContent=v.title;document.querySelector('#sub').textContent=v.sub;document.querySelector('#src').textContent=v.src;svg.setAttribute('aria-label',v.title);v.render()}
    render();document.querySelector('#card').addEventListener('click',render);
  </script>
</body>
</html>
