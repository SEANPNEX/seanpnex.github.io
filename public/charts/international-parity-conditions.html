<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>International parity conditions</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root{--paper:#F0EFEB;--ink:#1C1C1A;--muted:#6A6963;--soft:#A8A7A0;--grid:#D8D6CE;--faint:#E3E2DB}
    *{box-sizing:border-box}
    body{margin:0;background:var(--paper);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,sans-serif}
    .card{padding:29px 30px 18px;border-radius:24px;overflow:hidden}
    h2{max-width:760px;margin:0;font-size:clamp(25px,4vw,42px);font-weight:700;line-height:1.05;letter-spacing:-.035em}
    .sub{margin:10px 0 14px;color:var(--muted);font-size:12px;line-height:1.5}
    .modes{display:flex;flex-wrap:wrap;gap:6px}
    .modes button{padding:8px 13px;border:1px solid var(--grid);border-radius:999px;background:transparent;color:var(--muted);font:600 11px/1 Inter,ui-sans-serif,system-ui,sans-serif;letter-spacing:.02em;cursor:pointer;transition:background .25s,color .25s,border-color .25s}
    .modes button:hover{border-color:var(--soft);color:var(--ink)}
    .modes button[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--paper)}
    svg{display:block;width:100%;height:auto;margin:8px 0 6px;overflow:visible}
    svg.narrow{max-width:420px;margin:8px auto 6px}
    .note{max-width:660px;margin:0 0 12px;font-size:13px;line-height:1.5}
    .src{color:#8A8983;font-size:9px;font-weight:700;letter-spacing:.14em;text-transform:uppercase}

    .edge line{fill:none;stroke-linecap:round;transition:stroke .3s,stroke-width .3s,opacity .3s}
    .edge .solid{stroke:var(--ink);stroke-width:1.4;stroke-dasharray:1;stroke-dashoffset:1}
    .edge .dash{stroke:var(--ink);stroke-width:2.2;stroke-dasharray:6 5;opacity:0}
    .edge .pill{fill:var(--paper);stroke:var(--ink);stroke-width:1;transition:fill .3s,stroke .3s}
    .edge text{fill:var(--ink);font-size:12px;font-weight:700;letter-spacing:.04em;text-anchor:middle;dominant-baseline:central;transition:fill .3s}
    .edge .pill-g{opacity:0;transition:opacity .35s}
    .edge.given .solid{stroke-width:2.6}
    .edge.given .pill{fill:var(--ink)}
    .edge.given text{fill:var(--paper)}
    .edge.implied .solid{opacity:0}
    .edge.implied .dash{opacity:1}
    .edge.implied .pill{stroke-width:1.6;stroke-dasharray:3 2}
    .edge.fade .solid{stroke:var(--grid)}
    .edge.fade .pill{stroke:var(--grid)}
    .edge.fade text{fill:var(--soft)}

    .node{opacity:0;transition:opacity .3s}
    .node rect{fill:var(--ink);transition:fill .3s}
    .node .name{fill:var(--soft);font-size:10px;font-weight:600;letter-spacing:.1em;text-anchor:middle;transition:fill .3s}
    .node .formula{fill:var(--paper);font-size:20px;font-weight:800;text-anchor:middle;transition:fill .3s}
    .node .value{fill:var(--paper);font-size:12.5px;font-weight:700;text-anchor:middle;opacity:0;transition:opacity .3s}
    .node.fade rect{fill:var(--faint)}
    .node.fade .name{fill:var(--soft)}
    .node.fade .formula{fill:var(--soft)}
    .mode-all .node .value{opacity:1}

    .tri{fill:var(--soft);font-size:10px;font-weight:700;letter-spacing:.14em;text-anchor:middle;opacity:0;transition:fill .3s,opacity .3s}
    .tri.on{fill:var(--ink)}
    .narrow .edge text{font-size:10.5px}.narrow .node .name{font-size:8.5px}.narrow .node .formula{font-size:17px}.narrow .node .value{font-size:11px}.narrow .tri{font-size:9px}

    .shown .node,.shown .edge .pill-g,.shown .tri{opacity:1}
    .shown .edge .solid{stroke-dashoffset:0;transition:stroke-dashoffset .9s cubic-bezier(.165,.84,.44,1) var(--d),stroke .3s,stroke-width .3s,opacity .3s}
    .shown .node{transition:opacity .45s var(--d)}
    .shown .edge .pill-g{transition:opacity .35s var(--d2)}
    .shown .edge.implied .dash{animation:march 1.2s linear infinite}
    @keyframes march{to{stroke-dashoffset:-22}}

    @media(max-width:600px){.card{padding:22px 16px 16px}.note{font-size:12.5px}}
    @media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;transition-delay:0s!important}}
  </style>
  <script src="chart-fx.js"></script>
</head>
<body>
  <main class="card">
    <h2>Any two parity links imply a third.</h2>
    <div class="sub">S = units of foreign currency per unit of domestic currency · each line = one parity condition, equating the two quantities it joins · pick a view</div>
    <div class="modes" role="group" aria-label="View">
      <button type="button" data-mode="all">All five hold</button>
      <button type="button" data-mode="fwd">CIRP + UIRP ⇒ FRP</button>
      <button type="button" data-mode="infl">PPP + IFE ⇒ UIRP</button>
    </div>
    <svg id="chart" role="img" aria-label="Four quantities joined by five parity conditions"></svg>
    <p class="note" id="note" aria-live="polite"></p>
    <div class="src">PARITY NETWORK · 4 QUANTITIES · 5 CONDITIONS · LINEAR APPROXIMATIONS</div>
  </main>
  <script src="i18n.js"></script>

  fr: {
    'International parity conditions': 'Conditions de parité internationales',
    'Any two parity links imply a third.': 'Deux relations de parité en impliquent une troisième.',
    'S = units of foreign currency per unit of domestic currency · each line = one parity condition, equating the two quantities it joins · pick a view': 'S = unités de devise étrangère par unité de monnaie nationale · chaque ligne = une condition de parité, qui égalise les deux grandeurs qu’elle relie · choisir une vue',
    'View': 'Vue',

  <script>
    // Four quantities sit on a diamond. UIRP is the shared diagonal, so the two
    // triangles it creates are the two chains of reasoning a reader can follow.
    const QUANTITIES = {
      rate: { name: 'INTEREST-RATE GAP',      formula: [['i'], ['f', 'sub'], [' − i'], ['d', 'sub']] },
      fwd:  { name: 'FORWARD PREMIUM',        formula: [['(F − S) / S']] },
      spot: { name: 'EXPECTED SPOT CHANGE',   formula: [['E[%ΔS]']] },
      infl: { name: 'EXPECTED INFLATION GAP', formula: [['π'], ['f', 'sub'], [' − π'], ['d', 'sub']] },
    };
    const EXAMPLE = '≈ 2%';
    const CONDITIONS = [
      { id: 'CIRP', name: 'Covered interest-rate parity',    from: 'rate', to: 'fwd' },
      { id: 'FRP',  name: 'Forward-rate parity',             from: 'fwd',  to: 'spot' },
      { id: 'UIRP', name: 'Uncovered interest-rate parity',  from: 'rate', to: 'spot' },
      { id: 'IFE',  name: 'International Fisher effect',     from: 'rate', to: 'infl' },
      { id: 'PPP',  name: 'Ex-ante purchasing power parity', from: 'infl', to: 'spot' },
    ];
    const MODES = {
      all: {
        given: [], implied: [], nodes: ['rate', 'fwd', 'spot', 'infl'], tri: [],
        note: 'Each line sets the two quantities it joins equal. If all five conditions hold, a 2% interest-rate gap appears at every corner: the forward premium, the expected spot change and the expected inflation gap all come out near 2%.',
      },
      fwd: {
        given: ['CIRP', 'UIRP'], implied: ['FRP'], nodes: ['rate', 'fwd', 'spot'], tri: ['fwd'],
        note: 'CIRP sets the forward premium equal to the interest-rate gap; UIRP sets the expected spot change equal to the same gap. Two quantities equal to the same gap equal each other, so forward-rate parity follows: the forward rate is an unbiased forecast of the future spot rate.',
      },
      infl: {
        given: ['PPP', 'IFE'], implied: ['UIRP'], nodes: ['rate', 'spot', 'infl'], tri: ['infl'],
        note: 'Ex-ante PPP sets the expected spot change equal to the expected inflation gap; the international Fisher effect sets the interest-rate gap equal to the same inflation gap. So the interest-rate gap equals the expected spot change, and UIRP follows.',
      },
    };
    const LAYOUTS = {
      wide:   { w: 760, h: 340, nw: 206, nh: 82, sub: 13, pos: { rate: [113, 170], spot: [647, 170], fwd: [380, 47], infl: [380, 293] } },
      narrow: { w: 360, h: 440, nw: 150, nh: 70, sub: 11, pos: { rate: [82, 220],  spot: [278, 220], fwd: [180, 52], infl: [180, 388] } },
    };

    const NS = 'http://www.w3.org/2000/svg';
    const svg = document.getElementById('chart');
    const note = document.getElementById('note');
    const buttons = [...document.querySelectorAll('.modes button')];
    const T = (s) => (window.chartI18n ? chartI18n.t(s) : s);
    let mode = 'all', layoutKey = null, seen = false;

    function el(tag, attrs, parent) {
      const node = document.createElementNS(NS, tag);
      for (const [k, v] of Object.entries(attrs || {})) node.setAttribute(k, v);
      if (parent) parent.appendChild(node);
      return node;
    }

    function render() {
      const L = LAYOUTS[layoutKey];
      svg.setAttribute('viewBox', `0 0 ${L.w} ${L.h}`);
      svg.classList.toggle('narrow', layoutKey === 'narrow');
      svg.innerHTML = '';
      const edges = el('g', {}, svg);
      const P = L.pos;

      const [cx, cy] = P.fwd, [, ry] = P.rate, [, by] = P.infl;
      el('text', { class: 'tri', 'data-tri': 'fwd', x: cx, y: (cy + 2 * ry) / 3 + 3 }, svg).textContent = 'FORWARD TRIANGLE';
      el('text', { class: 'tri', 'data-tri': 'infl', x: cx, y: (by + 2 * ry) / 3 + 3 }, svg).textContent = 'INFLATION TRIANGLE';

      CONDITIONS.forEach((c, i) => {
        const [x1, y1] = P[c.from], [x2, y2] = P[c.to];
        // A condition lights the two quantities it equates; a quantity lights every condition on it.
        const g = el('g', { class: 'edge', 'data-id': c.id, 'data-edge': `${c.from}>${c.to}`, 'data-tip': `${T(c.name)}\n${T(QUANTITIES[c.from].name).toLowerCase()} = ${T(QUANTITIES[c.to].name).toLowerCase()}`, style: `--d:${380 + i * 110}ms;--d2:${780 + i * 110}ms` }, edges);
        el('line', { x1, y1, x2, y2, stroke: 'transparent', 'stroke-width': 14 }, g);
        el('line', { class: 'solid', x1, y1, x2, y2, pathLength: 1 }, g);
        el('line', { class: 'dash', x1, y1, x2, y2 }, g);
        const pill = el('g', { class: 'pill-g', transform: `translate(${(x1 + x2) / 2},${(y1 + y2) / 2})` }, g);
        const w = c.id.length * (layoutKey === 'narrow' ? 8 : 9) + 20, h = layoutKey === 'narrow' ? 21 : 24;
        el('rect', { class: 'pill', x: -w / 2, y: -h / 2, width: w, height: h, rx: h / 2 }, pill);
        el('text', { y: 0.5 }, pill).textContent = c.id;
      });

      Object.entries(QUANTITIES).forEach(([key, q], i) => {
        const [x, y] = P[key];
        const links = CONDITIONS.filter((c) => c.from === key || c.to === key).map((c) => c.id).join(', ');
        const g = el('g', { class: 'node', 'data-key': key, 'data-node': key, 'data-tip': `${T(q.name)}\nlinked by ${links}`, transform: `translate(${x},${y})`, style: `--d:${i * 80}ms` }, svg);
        el('rect', { x: -L.nw / 2, y: -L.nh / 2, width: L.nw, height: L.nh, rx: 14 }, g);
        el('text', { class: 'name', y: -L.nh / 2 + (layoutKey === 'narrow' ? 19 : 22) }, g).textContent = q.name;
        const f = el('text', { class: 'formula', y: layoutKey === 'narrow' ? 7 : 8 }, g);
        let lowered = false;
        q.formula.forEach(([text, role]) => {
          const span = el('tspan', {}, f);
          if (role === 'sub' && !lowered) { span.setAttribute('dy', 4); span.setAttribute('font-size', L.sub); lowered = true; }
          else if (role === 'sub') span.setAttribute('font-size', L.sub);
          else if (lowered) { span.setAttribute('dy', -4); lowered = false; }
          span.textContent = text;
        });
        el('text', { class: 'value', y: L.nh / 2 - (layoutKey === 'narrow' ? 11 : 13) }, g).textContent = EXAMPLE;
      });

      // Translated node names can run longer than the English; shrink to fit.
      requestAnimationFrame(() => svg.querySelectorAll('.node .name').forEach((t) => {
        const room = L.nw - 18, len = t.getComputedTextLength();
        if (len > room) t.style.fontSize = `${parseFloat(getComputedStyle(t).fontSize) * room / len}px`;
      }));
      apply();
    }

    function apply() {
      const m = MODES[mode];
      svg.classList.toggle('mode-all', mode === 'all');
      svg.querySelectorAll('.edge').forEach((g) => {
        const id = g.dataset.id;
        const given = m.given.includes(id), implied = m.implied.includes(id);
        g.classList.toggle('given', given);
        g.classList.toggle('implied', implied);
        g.classList.toggle('fade', mode !== 'all' && !given && !implied);
      });
      svg.querySelectorAll('.node').forEach((g) => g.classList.toggle('fade', !m.nodes.includes(g.dataset.key)));
      svg.querySelectorAll('.tri').forEach((t) => t.classList.toggle('on', m.tri.includes(t.dataset.tri)));
      buttons.forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.mode === mode)));
      note.textContent = T(m.note);
    }

    function reveal() {
      svg.classList.remove('shown');
      void svg.getBoundingClientRect();
      requestAnimationFrame(() => svg.classList.add('shown'));
    }

    function layout() {
      const key = svg.getBoundingClientRect().width < 520 ? 'narrow' : 'wide';
      if (key === layoutKey) return;
      layoutKey = key;
      render();
      if (seen) svg.classList.add('shown');
    }

    // Reserve room for the longest caption so switching views never shifts the
    // page, then tell the host page how tall the card is.
    function fit() {
      note.style.minHeight = '';
      const current = note.textContent;
      let tallest = 0;
      for (const m of Object.values(MODES)) {
        note.textContent = T(m.note);
        tallest = Math.max(tallest, note.getBoundingClientRect().height);
      }
      note.textContent = current;
      note.style.minHeight = `${tallest}px`;
      if (parent !== window) parent.postMessage({ chartHeight: document.querySelector('.card').scrollHeight }, location.origin);
    }

    buttons.forEach((b) => b.addEventListener('click', () => { mode = b.dataset.mode; apply(); }));
    svg.addEventListener('click', reveal);
    window.addEventListener('resize', () => { layout(); fit(); });
    layout();
    fit();
    document.fonts?.ready.then(fit);
    new IntersectionObserver((entries, obs) => {
      if (!entries[0].isIntersecting) return;
      seen = true; reveal(); obs.disconnect();
    }, { threshold: 0.3 }).observe(svg);
  </script>
</body>
</html>
