<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Excess purchase price · goodwill split</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="curve-kit.js"></script>
</head>
<body>
  <main class="card" id="card">
    <h2>Excess PP splits into an amortized step-up and unamortized goodwill.</h2>
    <div class="sub">Schematic · one purchase price stacked bottom-up: book-value share → fair value appreciation → goodwill · darkest = book value, lightest = goodwill</div>
    <svg id="ch" role="img" aria-label="Stacked column: proportionate share of book value, fair value appreciation, goodwill; purchase price spans all, fair value share spans bottom two, excess purchase price spans top two"></svg>
    <div class="src">STACKED RUNGS · LIEFLAT F7 · EXCESS PURCHASE PRICE (SCHEMATIC)</div>
  </main>
  <script>
  // ── Layers, bottom to top (schematic heights) ──
  var LAYERS = [
    { name: 'Share of book value of net identifiable assets', short: 'Book value share', h: 0.5, fill: '#1C1C1A', text: '#F0EFEB' },
    { name: 'Fair value appreciation', short: 'FV appreciation', h: 0.25, fill: '#6A6963', text: '#F0EFEB',
      note: 'IS amortized', detail: "against the investee's profit, reducing the equity-method pickup, over the economic lives of the related assets" },
    { name: 'Goodwill', short: 'Goodwill', h: 0.25, fill: '#BEBDB6', text: '#1C1C1A',
      note: 'NOT amortized', detail: 'reviewed for impairment instead' },
  ];
  var K = curveKit, C = K.C;
  K.mount(document.getElementById('ch'), function (svg, W, H) {
    var nw = W < 520;
    var TOP = 10, BASE = H - 6, span = BASE - TOP;
    var LEFT = nw ? Math.round(W * 0.27) : Math.round(W * 0.26), CW = nw ? 72 : 130;
    var cx0 = LEFT, cx1 = LEFT + CW;
    var bounds = [], acc = 0;
    LAYERS.forEach(function (l) { bounds.push([BASE - acc * span, BASE - (acc + l.h) * span]); acc += l.h; });
    LAYERS.forEach(function (l, i) {
      var y0 = bounds[i][0], y1 = bounds[i][1], d = 0.1 + i * 0.12;
      K.el(svg, 'rect', { x: cx0, y: y1, width: CW, height: y0 - y1 - (i < 2 ? 0 : 0), fill: l.fill, class: 'fade', style: 'animation-delay:' + d + 's' });
      if (i) K.el(svg, 'line', { x1: cx0, y1: y0, x2: cx1, y2: y0, stroke: C.PAPER, 'stroke-width': 1.5 });
      K.label(svg, (cx0 + cx1) / 2, (y0 + y1) / 2 + 3, nw ? l.short : l.name, { size: nw ? 9 : 10.5, weight: 700, fill: l.text, anchor: 'middle', middle: true, maxWidth: CW - 10, halo: 0, delay: d + 0.1 });
    });
    function br(x, a, b, dir, d) {
      K.el(svg, 'path', { d: 'M' + (x + 5 * dir) + ' ' + (a + 1) + ' H' + x + ' V' + (b - 1) + ' H' + (x + 5 * dir), fill: 'none', stroke: C.INK, 'stroke-width': 1.1, class: 'fade', style: 'animation-delay:' + d + 's' });
    }
    var sz = nw ? 9.5 : 11;
    // left, inner: FV share = bottom two layers
    var xi = cx0 - 10; br(xi, bounds[1][1], BASE, 1, 0.5);
    K.label(svg, xi - 6, (bounds[1][1] + BASE) / 2, 'Share of fair value of net identifiable assets', { size: sz, weight: 800, anchor: 'end', middle: true, maxWidth: xi - 26, delay: 0.55 });
    // left, outer: purchase price = whole column; label sits in the goodwill band, above the inner bracket
    br(6, TOP, BASE, 1, 0.6);
    K.label(svg, 14, (bounds[2][0] + TOP) / 2 + 4, 'Purchase price', { size: sz, weight: 800, middle: true, maxWidth: xi - 22, delay: 0.65 });
    // right: excess PP = top two layers, label rotated along the bracket
    var xr = cx1 + 10; br(xr, TOP, bounds[1][0], -1, 0.7);
    K.along(svg, xr, bounds[1][0], xr, TOP, 0.5, 'Excess purchase price', { size: nw ? 9.5 : 10.5, weight: 800, anchor: 'middle', below: true, offset: 4, delay: 0.75 });
    // notes per layer
    var nx = xr + (nw ? 22 : 26), mw = W - nx - 4;
    [2, 1].forEach(function (i, k) {
      var l = LAYERS[i], y1 = bounds[i][1], d = 0.85 + k * 0.1;
      var t = K.label(svg, nx, y1 + 14, l.note, { size: sz, weight: 800, maxWidth: mw, delay: d });
      K.label(svg, nx, t.bottom + (nw ? 10 : 12), l.detail, { size: nw ? 8.5 : 9.5, weight: 500, fill: C.MUTED, maxWidth: mw, delay: d });
    });
  }, function (W) { return W < 520 ? 330 : 320; });
  </script>
</body>
</html>
