<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Financial asset measurement · three stories</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{--bg:#F0EFEB;--ink:#1C1C1A;--muted:#8F8E88;--faint:#C6C5BF;--grid:#DEDDD6}
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--bg);font-family:'Inter',sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased}
  .card{background:var(--bg);border-radius:24px;padding:22px 22px 14px}
  h2{font-weight:700;font-size:16.5px;letter-spacing:-.02em;margin-bottom:3px;max-width:48em;line-height:1.25}
  .sub{font-size:11.5px;color:var(--muted);margin-bottom:10px;line-height:1.5}
  .src{font-size:9.5px;color:var(--faint);margin-top:8px;letter-spacing:.08em;font-weight:500;text-transform:uppercase}
  svg{display:block;width:100%;height:auto;max-height:620px;cursor:pointer}
  svg text{font-family:'Inter',sans-serif}
  .pop{transform-box:fill-box;transform-origin:center;animation:pop .45s cubic-bezier(.2,.7,.3,1.3) both}
  @keyframes pop{from{transform:scale(0)}to{transform:none}}
  .fade{animation:fade .75s ease both}
  @keyframes fade{from{opacity:0}}
  .draw{stroke-dasharray:1;stroke-dashoffset:1;animation:draw .9s cubic-bezier(.4,0,.2,1) both}
  @keyframes draw{to{stroke-dashoffset:0}}
  @media (prefers-reduced-motion:reduce){
    .pop,.fade{animation:none}
    .draw{animation:none;stroke-dasharray:none;stroke-dashoffset:0}
    svg{cursor:default}
  }
</style>
</head>
<body>
<div class="card" id="card">
  <h2>Three classifications, one bond life.</h2>
  <div class="sub">● RE · ○ AOCI · ◆ asset / FV · hairline = life of the holding · t = 0…3 · coupon 100 · YTM 12%</div>
  <svg id="lineage" viewBox="0 0 920 560" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Three parallel timelines for AMC, FVOCI, and FVPL measurement stories"></svg>
  <div class="src">TREND LINEAGE · LIEFLAT L11 · FINANCIAL ASSET MEASUREMENT</div>
</div>
<script>
(() => {
  // L11 Trend Lineage → library-外: parallel tracks + timed marks, rotated so time runs
  // left→right and stories stack as lanes (journal events, not product rise/fall/dormant).
  const INK = '#1C1C1A';
  const PAPER = '#F0EFEB';
  const MUTED = '#8F8E88';
  const FAINT = '#C6C5BF';
  const GRID = '#DEDDD6';
  const HAIR = '#E4E3DC';
  const L = ['#1C1C1A', '#4A4944', '#6A6963', '#8F8E88', '#B0AFA9', '#C6C5BF', '#D8D7D1'];
  const NS = 'http://www.w3.org/2000/svg';
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

  const el = (p, t, a) => {
    const n = document.createElementNS(NS, t);
    for (const k in a) n.setAttribute(k, a[k]);
    p.appendChild(n);
    return n;
  };
  const txt = (p, a, s) => {
    const n = el(p, 'text', a);
    n.textContent = s;
    return n;
  };
  const tip = (n, s) => {
    const t = document.createElementNS(NS, 'title');
    t.textContent = s;
    n.appendChild(t);
  };

  const timers = {};
  const obsReveal = (id, fn) => {
    const n = document.getElementById(id);
    const go = () => {
      (timers[id] || []).forEach(clearInterval);
      timers[id] = [];
      n.innerHTML = '';
      fn(n);
    };
    if (reduced) {
      go();
    } else {
      const io = new IntersectionObserver((es) => {
        if (es[0].isIntersecting) { go(); io.disconnect(); }
      }, { threshold: 0.15 });
      io.observe(n);
      n.addEventListener('click', go);
    }
  };

  // ── Data (user edits here) ──
  // Shared case: buy 951.96 · coupon 100/yr · YTM 12% · FV 980/999/1000 · AMC 951.96→966.2→982.14
  const TIMES = [0, 1, 2, 3];
  const STORIES = [
    {
      id: 'AMC',
      tip: 'Amortized cost · carrying walks by interest − coupon · FV ignored · RE = effective interest only',
      // marks: kind re|aoci|asset|cash|note · label · tip · dy (label offset from track)
      events: {
        0: [
          { kind: 'cash', label: 'cash −951.96', tip: 't0 buy · cash −951.96', dy: -28 },
          { kind: 'asset', label: 'AMC +951.96', tip: 't0 recognize asset at cost 951.96', dy: 26 },
        ],
        1: [
          { kind: 're', label: 'RE +114.24', tip: 't1 interest income = 951.96 × 12%', dy: -40 },
          { kind: 'asset', label: 'AMC → 966.2', tip: 't1 amort +14.24 (951.96×12% − 100) → 966.2', dy: -18 },
          { kind: 'cash', label: 'cash +100', tip: 't1 coupon cash +100', dy: 26 },
        ],
        2: [
          { kind: 're', label: 'RE +115.94', tip: 't2 interest income = 966.2 × 12%', dy: -40 },
          { kind: 'asset', label: 'AMC → 982.14', tip: 't2 amort +15.94 → 982.14', dy: -18 },
          { kind: 'cash', label: 'cash +100', tip: 't2 coupon cash +100', dy: 26 },
        ],
        3: [
          { kind: 're', label: 'RE +117.86', tip: 't3 interest income = 982.14 × 12%', dy: -40 },
          { kind: 'cash', label: 'redeem +1,100', tip: 't3 coupon +100 and principal +1,000', dy: -18 },
          { kind: 'asset', label: 'AMC off', tip: 't3 amort +17.86 then write off −1,000', dy: 26 },
        ],
      },
    },
    {
      id: 'FVOCI',
      tip: 'Same RE interest as AMC · asset follows FV · AOCI is the plug · life AOCI nets 0',
      events: {
        0: [
          { kind: 'cash', label: 'cash −951.96', tip: 't0 buy · cash −951.96', dy: -28 },
          { kind: 'asset', label: 'FVOCI +951.96', tip: 't0 at cost 951.96', dy: 26 },
        ],
        1: [
          { kind: 're', label: 'RE +114.24', tip: 't1 interest = AMC path', dy: -48 },
          { kind: 'asset', label: 'FV → 980', tip: 't1 mark to FV 980 · asset Δ +28.04', dy: -28 },
          { kind: 'aoci', label: 'AOCI +13.8', tip: 't1 AOCI = FV Δ − amort = 28.04 − 14.24', dy: 22 },
          { kind: 'cash', label: 'cash +100', tip: 't1 coupon cash +100', dy: 42 },
        ],
        2: [
          { kind: 're', label: 'RE +115.94', tip: 't2 interest = AMC path (100 + 15.94)', dy: -48 },
          { kind: 'asset', label: 'FV → 999', tip: 't2 mark to FV 999 · asset Δ +19', dy: -28 },
          { kind: 'aoci', label: 'AOCI +3.06', tip: 't2 AOCI = 19 − 15.94', dy: 22 },
          { kind: 'cash', label: 'cash +100', tip: 't2 coupon cash +100', dy: 42 },
        ],
        3: [
          { kind: 're', label: 'RE +117.86', tip: 't3 interest = AMC path (100 + 17.86)', dy: -48 },
          { kind: 'asset', label: 'FV → 1,000', tip: 't3 mark +1 then derecognize −1,000', dy: -28 },
          { kind: 'aoci', label: 'AOCI −16.86', tip: 't3 AOCI = 1 − 17.86 · life 13.8+3.06−16.86 = 0', dy: 22 },
          { kind: 'note', label: 'AOCI life = 0', tip: 'Cumulative AOCI over the holding nets to zero', dy: 42 },
        ],
      },
    },
    {
      id: 'FVPL',
      tip: 'Asset follows FV · coupon + FV Δ both go through RE (128.04 · 119 · 101)',
      events: {
        0: [
          { kind: 'cash', label: 'cash −951.96', tip: 't0 buy · cash −951.96', dy: -28 },
          { kind: 'asset', label: 'FVPL +951.96', tip: 't0 at cost 951.96', dy: 26 },
        ],
        1: [
          { kind: 're', label: 'RE +128.04', tip: 't1 RE = coupon 100 + FV Δ 28.04', dy: -40 },
          { kind: 'asset', label: 'FV → 980', tip: 't1 mark to FV 980', dy: -18 },
          { kind: 'cash', label: 'cash +100', tip: 't1 coupon cash +100', dy: 26 },
        ],
        2: [
          { kind: 're', label: 'RE +119', tip: 't2 RE = coupon 100 + FV Δ 19', dy: -40 },
          { kind: 'asset', label: 'FV → 999', tip: 't2 mark to FV 999', dy: -18 },
          { kind: 'cash', label: 'cash +100', tip: 't2 coupon cash +100', dy: 26 },
        ],
        3: [
          { kind: 're', label: 'RE +101', tip: 't3 RE = coupon 100 + FV Δ 1', dy: -40 },
          { kind: 'asset', label: 'FV → 1,000', tip: 't3 mark +1 then write off −1,000', dy: -18 },
          { kind: 'cash', label: 'redeem +1,100', tip: 't3 coupon +100 and principal +1,000', dy: 26 },
        ],
      },
    },
  ];

  obsReveal('lineage', (s) => {
    const W = 920;
    const H = 560;
    const left = 96;
    const right = W - 36;
    const trackX0 = left + 8;
    const trackX1 = right;
    const xAt = (t) => trackX0 + (t / 3) * (trackX1 - trackX0);
    const laneYs = [108, 278, 448];
    const laneH = 150;

    // Soft ledger hairlines (same furniture as B/S chart)
    for (let y = 6; y < H - 4; y += 7) {
      el(s, 'line', {
        x1: 18, y1: y, x2: W - 18, y2: y,
        stroke: HAIR, 'stroke-width': 0.45,
        class: 'fade', style: `animation-delay:${(y * 0.00035).toFixed(3)}s`,
      });
    }

    // Time grid + axis labels
    TIMES.forEach((t, i) => {
      const x = xAt(t);
      el(s, 'line', {
        x1: x, y1: 36, x2: x, y2: H - 28,
        stroke: GRID, 'stroke-width': 0.9,
        class: 'fade', style: `animation-delay:${0.05 + i * 0.04}s`,
      });
      txt(s, {
        x, y: 28,
        'font-size': 10, 'font-weight': 700, fill: MUTED,
        'text-anchor': 'middle', 'letter-spacing': '0.06em',
        class: 'fade', style: `animation-delay:${0.08 + i * 0.04}s`,
      }, `t = ${t}`);
    });

    // Top time rail
    el(s, 'line', {
      x1: trackX0, y1: 36, x2: trackX1, y2: 36,
      stroke: L[5], 'stroke-width': 0.7, pathLength: 1,
      class: 'draw', style: 'animation-delay:0.05s;animation-duration:0.7s',
    });

    STORIES.forEach((story, si) => {
      const y = laneYs[si];
      const delay = 0.12 + si * 0.14;

      // Lane band separator (faint)
      if (si > 0) {
        el(s, 'line', {
          x1: 22, y1: y - laneH / 2 + 8, x2: W - 22, y2: y - laneH / 2 + 8,
          stroke: GRID, 'stroke-width': 0.7,
          class: 'fade', style: `animation-delay:${delay}s`,
        });
      }

      // Lane label
      const lab = txt(s, {
        x: 28, y: y + 4,
        'font-size': 13, 'font-weight': 800, fill: INK,
        'letter-spacing': '0.12em',
        class: 'fade', style: `animation-delay:${delay}s`,
      }, story.id);
      tip(lab, story.tip);

      // Life track (L11 hairline, solid — holding alive to maturity)
      el(s, 'line', {
        x1: trackX0, y1: y, x2: trackX1, y2: y,
        stroke: L[4], 'stroke-width': 1.1, pathLength: 1,
        class: 'draw', style: `animation-delay:${delay + 0.05}s;animation-duration:0.75s`,
      });

      // Terminal maturity tick
      el(s, 'circle', {
        cx: trackX1, cy: y, r: 2.4, fill: INK,
        class: 'pop', style: `animation-delay:${delay + 0.55}s`,
      });

      TIMES.forEach((t, ti) => {
        const x = xAt(t);
        const evs = story.events[t] || [];

        // Anchor on track
        el(s, 'circle', {
          cx: x, cy: y, r: 2.2, fill: PAPER, stroke: L[3], 'stroke-width': 1,
          class: 'pop', style: `animation-delay:${delay + 0.15 + ti * 0.06}s`,
        });

        evs.forEach((ev, ei) => {
          const ey = y + ev.dy;
          const markDelay = delay + 0.22 + ti * 0.06 + ei * 0.03;

          // Leader tick from track to mark cluster
          el(s, 'line', {
            x1: x, y1: y + (ev.dy > 0 ? 4 : -4),
            x2: x, y2: ey + (ev.dy > 0 ? -8 : 8),
            stroke: L[5], 'stroke-width': 0.6,
            class: 'fade', style: `animation-delay:${markDelay}s`,
          });

          let node;
          if (ev.kind === 're') {
            node = el(s, 'circle', { cx: x, cy: ey, r: 5.2, fill: INK });
          } else if (ev.kind === 'aoci') {
            node = el(s, 'circle', {
              cx: x, cy: ey, r: 5.2, fill: PAPER, stroke: INK, 'stroke-width': 1.5,
            });
          } else if (ev.kind === 'asset') {
            node = el(s, 'polygon', {
              points: `${x},${ey - 5.4} ${x + 5.4},${ey} ${x},${ey + 5.4} ${x - 5.4},${ey}`,
              fill: L[1],
            });
          } else if (ev.kind === 'cash') {
            node = el(s, 'rect', {
              x: x - 4.2, y: ey - 4.2, width: 8.4, height: 8.4, rx: 1.2, fill: L[2],
            });
          } else {
            // note: small bar
            node = el(s, 'rect', {
              x: x - 7, y: ey - 2, width: 14, height: 4, rx: 1.5, fill: L[3],
            });
          }
          node.setAttribute('class', 'pop');
          node.style.animationDelay = `${markDelay}s`;
          tip(node, ev.tip);

          // Label — alternate left/right slightly when crowded on FVOCI
          let anchor = 'middle';
          let lx = x;
          if (story.id === 'FVOCI' && evs.length >= 4) {
            if (ei % 2 === 0) { lx = x - 8; anchor = 'end'; }
            else { lx = x + 8; anchor = 'start'; }
          }
          const ly = ey + (ev.dy > 0 ? 14 : -10);
          const label = txt(s, {
            x: lx, y: ly,
            'font-size': 8.2, 'font-weight': 600, fill: L[1],
            'text-anchor': anchor,
            class: 'fade', style: `animation-delay:${markDelay + 0.05}s`,
          }, ev.label);
          tip(label, ev.tip);
        });
      });
    });

    // Foot note: life RE totals identical
    txt(s, {
      x: W / 2, y: H - 10,
      'font-size': 8.5, 'font-weight': 600, fill: MUTED,
      'text-anchor': 'middle',
      class: 'fade', style: 'animation-delay:0.85s',
    }, 'Life RE totals match: 114.24 + 115.94 + 117.86 = 128.04 + 119 + 101 = 348.04');
  });
})();
</script>
</body>
</html>
