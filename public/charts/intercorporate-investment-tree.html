<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Intercorporate investment categories</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="curve-kit.js"></script>
  <script src="chart-fx.js"></script>
</head>
<body>
  <main class="card" id="card">
    <h2>Ownership and instrument decide the accounting path.</h2>
    <div class="sub">Equity vs bond, then purpose and influence · shade = FVPL darkest · FVOCI mid · AMC lightest · equity and acquisition methods in gray</div>
    <svg id="tree" role="img" aria-label="Intercorporate investment categories tree"></svg>
    <div class="src">TREE LR · LIEFLAT G7 · INTERCORPORATE INVESTMENTS</div>
  </main>
  <script>
(() => {
  const { C, el, label, mount } = curveKit;
  const SHADE = { FVPL: C.INK, FVOCI: '#6A6963', AMC: '#A8A7A0', method: '#8F8E88' };
  // Leaves: [name, treatment, shade key].
  const TREE = {
    name: 'Investment',
    kids: [
      { name: 'Equity', kids: [
        { name: 'Fin. assets', kids: [['Trading', 'FVPL', 'FVPL'], ['Other', 'FVOCI', 'FVOCI']] },
        { name: 'Long-term eq.', kids: [
          ['No influence', 'FVPL / FVOCI', 'method'],
          ['Associates', 'equity method', 'method'],
          ['Joint ventures', 'equity method', 'method'],
          ['Combinations', 'acquisition method', 'method'],
        ] },
      ] },
      { name: 'Bond', kids: [['Trading', 'FVPL', 'FVPL'], ['Other', 'FVOCI', 'FVOCI'], ['Bond', 'AMC', 'AMC']] },
    ],
  };
  const LEAVES = 9, GROUPS = 3;
  // Narrow cards put a leaf's treatment on a second line.
  const stacked = (w) => w < 470;
  const ROW = (w) => (stacked(w) ? 30 : 24), GAP = 12, PAD = 14;
  const height = (w) => PAD * 2 + LEAVES * ROW(w) + (GROUPS - 1) * GAP;

  mount(document.getElementById('tree'), (s, W, H) => {
    const two = stacked(W), row = ROW(W);
    // Measure the widest leaf label so the leaf column ends flush right.
    const probe = el(s, 'text', { 'font-size': 11.5, 'font-weight': 700, visibility: 'hidden' });
    const width = (t, size, weight) => { probe.setAttribute('font-size', size); probe.setAttribute('font-weight', weight); probe.textContent = t; return probe.getComputedTextLength(); };
    const leafW = (k) => (two ? Math.max(width(k[0], 11.5, 700), width(k[1], 10.5, 500)) : width(`${k[0]} · ${k[1]}`, 11.5, 700));
    const all = [];
    const walk = (n) => (Array.isArray(n) ? all.push(n) : n.kids.forEach(walk));
    walk(TREE);
    const rootW = width(TREE.name, 12.5, 800);
    const xLeaf = W - Math.max(...all.map(leafW)) - 12;
    probe.remove();

    // Narrow cards stand the root label on its side to free a column's width.
    const xRoot = two ? 24 : rootW + 12;
    const col = (d) => xRoot + ((xLeaf - xRoot) * d) / 3;

    // Lay leaves top to bottom, with a gap between the three leaf groups.
    let y = PAD + row / 2;
    const place = (n, depth) => {
      if (Array.isArray(n)) {
        const p = { leaf: n, x: xLeaf, y };
        y += row;
        return p;
      }
      const kids = n.kids.map((k) => place(k, depth + 1));
      if (kids.every((k) => k.leaf)) y += GAP;
      return { name: n.name, x: col(depth), y: (kids[0].y + kids[kids.length - 1].y) / 2, kids };
    };
    const root = place(TREE, 0);

    // Every mark carries its tree position, so hovering lights the branch above and below it.
    const link = (a, b, stroke, delay, path) => {
      const mx = (a.x + b.x) / 2;
      el(s, 'path', {
        'data-path': path,
        d: `M${a.x} ${a.y} C${mx} ${a.y} ${mx} ${b.y} ${b.x} ${b.y}`,
        fill: 'none', stroke, 'stroke-width': 1.3, pathLength: 1, class: 'draw',
        style: `animation-delay:${delay}s;animation-duration:.9s`,
      });
    };
    const draw = (n, parent, depth, path) => {
      if (n.leaf) {
        const [name, how, shade] = n.leaf, fill = SHADE[shade], delay = 0.35 + depth * 0.05 + n.y * 0.0008;
        const trail = path.split('/').slice(1).map((p) => p.replace(/#\d+$/, '')).join(' → ');
        link(parent, n, fill, 0.15 + depth * 0.08, path);
        el(s, 'circle', { cx: n.x, cy: n.y, r: 3.6, fill, class: 'pop', style: `animation-delay:${delay}s`, 'data-path': path, 'data-tip': `${trail}\n${how}` });
        const t = el(s, 'text', { x: n.x + 9, y: n.y + (two ? -1 : 4), 'font-size': 11.5, 'font-weight': 700, fill: C.INK, class: 'fade', style: `animation-delay:${delay}s`, 'data-path': path, 'data-tip': `${trail}\n${how}` });
        el(t, 'tspan', {}, name);
        if (two) el(t, 'tspan', { x: n.x + 9, dy: 12.5, 'font-size': 10.5, 'font-weight': 500, fill: C.MUTED }, how);
        else el(t, 'tspan', { 'font-weight': 500, fill: C.MUTED }, ` · ${how}`);
        return;
      }
      if (parent) link(parent, n, '#8F8E88', 0.1 + depth * 0.08, path);
      n.kids.forEach((k, i) => draw(k, n, depth + 1, `${path}/${k.leaf ? k.leaf[0] : k.name}#${i}`));
      el(s, 'circle', { cx: n.x, cy: n.y, r: depth ? 3.8 : 4.6, fill: C.INK, class: 'pop', style: `animation-delay:${0.1 + depth * 0.1}s`, 'data-path': path });
      if (!parent && two) {
        el(s, 'text', { x: 12, y: n.y, transform: `rotate(-90 12 ${n.y})`, 'font-size': 12, 'font-weight': 800, fill: C.INK, 'text-anchor': 'middle', class: 'fade' }, n.name);
      } else if (!parent) {
        label(s, n.x - 9, n.y + 4.5, n.name, { size: 12.5, anchor: 'end' });
      } else {
        // The incoming link arrives from the parent's side; label the other side.
        // Wrap to the column width so a long name never reaches the previous column's links.
        const below = parent.y < n.y;
        label(s, n.x + 4, below ? n.y + 17 : n.y - 9, n.name, {
          size: 11.5, weight: 700, anchor: 'end', up: !below, maxWidth: n.x - parent.x - 4, delay: 0.2 + depth * 0.1,
        });
        s.lastElementChild.setAttribute('data-path', path);
      }
    };
    draw(root, null, 0, 'Investment');
  }, height);
})();
  </script>
</body>
</html>
