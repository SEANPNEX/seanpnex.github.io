  <script>
(() => {
  const { C, T, label, frame, axes, curve, beads, guide, dot, arrow, probe, mount, html } = curveKit;
  // Illustrative parameters; PHI = θ/(1−α) + δ + n.
  const ALPHA = 0.33, A = 1.2, S = 0.3, PHI = 0.15, K = 8.2;
  const sy = (k) => S * A * Math.pow(k, ALPHA), ray = (k) => PHI * k;
  // s A k^α = φ k  ⇒  k* = (s A / φ)^(1/(1−α))
  const KS = Math.pow((S * A) / PHI, 1 / (1 - ALPHA)), YS = sy(KS);
  const height = (w) => Math.max(230, Math.min(300, w * 0.55));

  html('#sub', 'sy = sAkα · ray = (θ/(1−α)+δ+n)k · intersection → k*, y* · at steady state dy/y = θ/(1−α) is constant', [['sAkα', 'sAk<sup>α</sup>']]);
  html('#src', 'SOLOW STEADY-STATE · F2 HAIRLINE LINE · sy = sAkα', [['sy = sAkα', '<span class="f">sy = sAk<sup>α</sup></span>']]);

  mount(document.getElementById('solow'), (s, W, H) => {
    const F = frame(s, W, H, { l: 28, r: 12, t: 30, b: 32 }, K, ray(K) * 1.06);
    axes(s, F, T('capital intensity k →'), T('sy / required investment'));
    const xs = F.x(KS), ys = F.y(YS);
    guide(s, xs, ys + 6, xs, F.BASE, 0.45);
    guide(s, F.X0, ys, xs - 6, ys, 0.5);
    label(s, xs, F.BASE + 15, 'k*', { size: 11.5, anchor: 'middle', delay: 0.6 });
    label(s, F.X0 - 5, ys + 4, 'y*', { size: 11.5, anchor: 'end', delay: 0.65 });

    curve(s, F, ray, 0, K, { stroke: C.SOFT, width: 1.3 });
    curve(s, F, sy, 0, K, { delay: 0.06 });
    beads(s, F, sy, 0.3, K, { avoid: [KS] });

    // Curve names: savings under its right end, the ray above-left of its top.
    label(s, F.X1, F.y(sy(K)) + 18, 'sy = sAk^{α}', { anchor: 'end', delay: 0.7 });
    const kr = K * 0.9;
    label(s, F.x(kr) - 10, F.y(ray(kr)), '(θ/(1−α)+δ+n)k', { size: 10.5, weight: 700, fill: C.MUTED, anchor: 'end', delay: 0.75 });

    // Below k* savings exceed required investment, so k grows; above k*, it shrinks.
    const ay = F.BASE - 10;
    arrow(s, [[F.x(1), ay], [xs - 12, ay]], { stroke: C.MUTED, width: 1.2, delay: 1.05 });
    arrow(s, [[F.x(K * 0.94), ay], [xs + 12, ay]], { stroke: C.MUTED, width: 1.2, delay: 1.1 });

    dot(s, xs, ys, 5.2, C.INK, 0.72, `Steady state\nk* = ${KS.toFixed(2)} · y* = sy* = ${YS.toFixed(2)}`);
    // Stack the steady-state note upward from just above the dot.
    const room = xs - 10 - F.X0 - 4;
    let top = label(s, xs - 10, ys - 10, T('Steady-state'), { size: 12, anchor: 'end', maxWidth: room, up: true, delay: 0.85 }).top;
    top = label(s, xs - 10, top - 5, T('constant growth rate'), { size: 10.5, weight: 700, fill: C.MUTED, anchor: 'end', maxWidth: room, up: true, delay: 0.95 }).top;
    label(s, xs - 10, top - 4, 'dy/y = θ/(1−α)', { size: 10.5, anchor: 'end', delay: 1 });
    probe(s, F, [{ name: 'sy', f: sy }, { name: 'required investment', f: ray, stroke: C.SOFT }]);
  }, height);
})();
