/* Unit review deck. Append future cards here: { id, topic, front, back, gap }. front, back and gap take HTML. */
const CARDS = [
  {
    "id": "f4-systemic",
    "topic": "Systemic importance",
    "front": "Why are banks systemically important, and what is financial contagion?",
    "back": "<div class=\"ans\"><p>Banks create <strong>linkages across all types of entities</strong> (other banks, companies, households, governments), so one failure can threaten the whole system.</p><p><strong>Contagion</strong>: losses spread through counterparty exposures, depositor runs and fire-sale prices. The largest banks are <strong>G-SIBs</strong> and hold extra capital.</p></div>",
    "gap": "This is why financial institutions are heavily regulated, unlike most companies."
  },
  {
    "id": "f4-regulators",
    "topic": "Regulators",
    "front": "Name the international bodies that set standards for financial institutions.",
    "back": "<div class=\"ans\"><ul><li><strong>Basel Committee</strong>: bank capital, liquidity, funding (Basel III)</li><li><strong>Financial Stability Board</strong>: global financial stability; identifies G-SIBs</li><li><strong>IADI</strong>: deposit insurance</li><li><strong>IAIS</strong>: insurance supervision</li><li><strong>IOSCO</strong>: securities markets</li></ul></div>"
  },
  {
    "id": "f4-balance-sheet",
    "topic": "Bank balance sheets",
    "front": "How do a bank's assets and liabilities differ from those of a non-financial company?",
    "back": "<div class=\"ans\"><ul><li><strong>Assets</strong>: mostly <strong>financial</strong> (loans, securities), many at fair value, so closer to market value and exposed to credit, market and liquidity risk</li><li><strong>Liabilities</strong>: mostly <strong>deposits</strong>, withdrawable at short notice → <strong>maturity mismatch</strong></li><li><strong>High leverage</strong>: a small loss on assets can wipe out a large share of equity</li></ul></div>"
  },
  {
    "id": "f4-basel",
    "topic": "Basel III · aims and requirements",
    "front": "What are Basel III's three requirements?",
    "back": "<div class=\"ans\"><ul><li><strong>Minimum capital</strong>, relative to risk-weighted assets</li><li><strong>Minimum liquidity</strong>: survive 30 days of stress (LCR)</li><li><strong>Stable funding</strong>: fund long-term assets with stable sources (NSFR)</li></ul><p>Aims: absorb shocks from any source, improve risk management, strengthen transparency and disclosure.</p></div>"
  },
  {
    "id": "f4-camels",
    "topic": "CAMELS",
    "front": "What does CAMELS stand for?",
    "back": "<div class=\"ans\"><ul><li><strong>C</strong>apital adequacy</li><li><strong>A</strong>sset quality</li><li><strong>M</strong>anagement capabilities</li><li><strong>E</strong>arnings sufficiency</li><li><strong>L</strong>iquidity position</li><li><strong>S</strong>ensitivity to market risk</li></ul></div>"
  },
  {
    "id": "f4-rwa",
    "topic": "Capital · risk-weighted assets",
    "front": "How are risk-weighted assets computed? A bank holds cash 100 and government bonds 300 (0%), mortgages 400 (35%) and corporate loans 200 (100%). What are RWA?",
    "back": "<div class=\"ans\"><div class=\"eq-block\">$$\\text{RWA}=\\sum_i\\text{Exposure}_i\\times\\text{Risk weight}_i$$</div><p>\\(0+0+400\\times35\\%+200\\times100\\%=\\) <strong>340</strong>, out of total assets of 1,000. RWA also include charges for market and operational risk.</p></div>",
    "gap": "Capital ratios divide by RWA, not total assets: riskier assets need more capital."
  },
  {
    "id": "f4-tiers",
    "topic": "Capital · tiers",
    "front": "What is in CET1, Additional Tier 1 and Tier 2 capital?",

    "gap": "Tier 1 = CET1 + AT1; total capital = Tier 1 + Tier 2."
  },
  {
    "id": "f4-minimums",

  },
  {
    "id": "f4-allowance",

    "gap": "The provision is a management estimate: under-providing raises profit now and leaves losses for later."
  },
  {
    "id": "f4-aq-ratios",
    "topic": "Asset quality · ratios",
    "front": "What do the three allowance ratios show?",
    "back": "<div class=\"ans\"><ul><li><strong>Allowance / non-performing loans</strong>: how much of the troubled loans is covered</li><li><strong>Allowance / net charge-offs</strong>: how many years of losses the allowance absorbs</li><li><strong>Provision / net charge-offs</strong>: below 1 means the allowance is being drawn down</li></ul></div>",
    "gap": "Falling ratios, or ratios well below peers, suggest under-reserving."
  },
  {
    "id": "f4-earnings",
    "topic": "Earnings sufficiency",
    "front": "What are a bank's three income sources, and which are most sustainable?",
    "back": "<div class=\"ans\"><ul><li><strong>Net interest income</strong></li><li><strong>Service income</strong> (fees and commissions)</li><li><strong>Trading income</strong></li></ul><p>A larger share of net interest and service income is <strong>more sustainable</strong> than trading income; lower volatility in net interest income is better.</p></div>",
    "gap": "Earnings quality also depends on estimates: loan-loss provisions and Level 3 fair values."
  },
  {
    "id": "f4-liquidity",
    "topic": "Liquidity · LCR and NSFR",
    "front": "Define the LCR and the NSFR. What else signals a liquidity risk?",
    "back": "<div class=\"ans\"><div class=\"eq-block\">$$\\text{LCR}=\\frac{\\text{HQLA}}{\\text{30-day net outflows}}\\ge100\\%$$</div><div class=\"eq-block\">$$\\text{NSFR}=\\frac{\\text{Available SF}}{\\text{Required SF}}\\ge100\\%$$</div><p>HQLA: high-quality liquid assets; SF: stable funding. Also: <strong>concentration of funding</strong> (few depositors, short-term wholesale funding) and <strong>contractual maturity mismatch</strong>.</p></div>",
    "gap": "LCR is a short-term stress test; NSFR is structural, over one year."
  },
  {
    "id": "f4-market-risk",
    "topic": "Sensitivity to market risk",
    "front": "How does an analyst assess a bank's sensitivity to market risk?",
    "back": "<div class=\"ans\"><ul><li><strong>VaR</strong> of the trading book, and <strong>trading revenue per unit of VaR</strong></li><li>Mismatches in the <strong>maturity</strong>, <strong>repricing frequency</strong> and <strong>reference rates</strong> of assets and liabilities</li><li>Currency exposures</li></ul></div>"
  },
  {
    "id": "f4-pc",
    "topic": "Insurers · P&C business",
    "front": "What features of property and casualty insurers matter for analysis?",
    "back": "<div class=\"ans\"><ul><li><strong>Cyclical</strong>: the underwriting cycle of competition, falling premiums and rising losses</li><li><strong>Loss reserves</strong>: estimates of future claims, the main source of discretion; <strong>reserve development</strong> shows how good they were</li><li>Premiums are invested <strong>conservatively</strong> (the float), mostly in high-quality bonds</li></ul></div>",
    "gap": "There are no global capital requirements for insurers: rules are national (US risk-based capital, EU Solvency II)."
  },

    "id": "f4-ratios",
    "topic": "Insurers · underwriting ratios",
    "front": "Give the loss and LAE ratio, underwriting expense ratio, combined ratio and combined ratio after dividends.",

    "gap": "The dividends ratio is added, not subtracted: it is a further cost."
  },

    "gap": "A combined ratio above 100% can still be profitable overall if investment income covers the underwriting loss."
  }
];
