    id: "eq-m3-fcfe-from-sales-growth-target-dr-2026-11-16",
    topic: "EQ M3 · FCFE from sales growth, target DR",
    front: `The target capital structure is 40% debt / 60% equity. Sales rise by 500 million. Incremental net fixed capital investment is 30%, and working capital investment is 20%, of the sales increase. NI is 1,000 million. What is FCFE?`,
    back: `<div class="ans">
      <p><strong>850 million.</strong> Investment is the given rate times the sales increase; “net” fixed capital investment already nets out depreciation. With a target debt ratio, equity bears only \\((1-\\text{DR})\\) of new investment. (Figures are quiz data, not a textbook example.)</p><ul><li>Net FCInv is \\((\\text{FCInv}-\\text{Dep})=0.30\\times500=150\\); \\(\\text{WCInv}=0.20\\times500=100\\); total investment is 250. Equity funds \\((1-\\text{DR})\\times250=0.6\\times250=150\\).</li><li>\\(\\text{FCFE}=\\text{NI}-(1-\\text{DR})(\\text{FCInv}-\\text{Dep})-(1-\\text{DR})\\text{WCInv}=1{,}000-150=850\\).</li></ul>
    </div>`,

  {
    id: "eq-m4-ev-ebitda-vs-ev-fcff-capex-2026-11-15",
    topic: "EQ M4 · EV/EBITDA vs EV/FCFF",
    front: `Two firms have the same EV/EBITDA, but Firm A requires much heavier capex than Firm B. Which firm is more expensive, and why? Does EV/FCFF have the same limitation?`,
    back: `<div class="ans">
      <p><strong>Firm A is more expensive.</strong> EV/EBITDA hides differences in capital programs because EBITDA ignores capex (it reflects capex only if D&amp;A ≈ capex). FCFF does <strong>not</strong> have the same blind spot.</p><ul><li>FCFF adds back non-cash D&amp;A but subtracts actual capex (FCInv) and WCInv: \\(\\text{FCFF}=\\text{EBITDA}(1-t)+\\text{Dep}\\times t-\\text{FCInv}-\\text{WCInv}\\).</li><li>So EV/FCFF reveals capital intensity; EV/EBITDA does not. FCFF “directly reflects the amount of the company’s required capital expenditures” and has a stronger link to valuation theory than EBITDA.</li></ul><p><em>Simplified illustration, not a textbook example</em> (taxes and WCInv ignored, so \\(\\text{FCFF}=\\text{EBITDA}-\\text{FCInv}\\)): EV 1,000 and EBITDA 100 for both (EV/EBITDA 10x). Capex 60 for A vs 20 for B → FCFF 40 vs 80 → EV/FCFF 25x vs 12.5x.</p>
    </div>`,
    gap: "Identified A as more expensive but couldn't explain why; thought FCFF has the same blind spot because it adds back D&A."
  },

    </div>`,
    gap: "Used the retention ratio \\(b=0.6\\) instead of the payout \\(1-b=0.4\\), and left out \\((1+g)\\) for the trailing P/E."

    front: `NI is 1,200, ROE is 16.67%, sales are 12,000, \\(r\\) is 12%, and the increase in retained earnings is 720. What is the justified trailing P/S?`,

  {

    topic: "EQ M5 · Multistage RI, P/B terminal",
    front: `\\(B_0\\) (start of 2020) is 10, ROE is 20% for 3 years, the payout is 50%, \\(r\\) is 12%, and the forecast P/B at the end of 2022 is 1.5. What is the value today?`,
    back: `<div class="ans">

  {
    id: "eq-m6-excess-earnings-intangibles-2026-11-15",
    topic: "EQ M6 · Excess earnings method",
    front: `How does the excess earnings method value intangibles?`,
    back: `<div class="ans">
      <p>It capitalizes the earnings that remain after the required returns on tangible assets — it does not take intangibles from the financial statements.</p><ul><li>Estimate normalized earnings. Then take the fair market value of working capital and fixed assets and their required returns. Those required returns rise from working capital (lowest, \\(r_{WC}\\)) to fixed assets (\\(r_{FA}\\)) to intangibles (highest, \\(r_{RI}\\)).</li><li>\\(\\text{RI}_t=\\text{Normalized income}-(WC\\times r_{WC})-(FA\\times r_{FA})\\). Capitalize the excess earnings at the intangible-asset (residual-income) discount rate: \\(\\text{RV}_t=\\dfrac{\\text{RI}_t(1+g)}{r_{RI}-g}\\).</li><li>Firm value = working capital + fixed assets + the value of intangibles (\\(\\text{RV}_t\\)).</li></ul>
    </div>`,

    back: `<div class="ans">
      <p><strong>1,211k</strong> of normalized operating income after taxes. The excess compensation is a pre-tax SG&amp;A add-back; tax it when the target is after-tax operating income. (Figures are quiz data, not a textbook example.)</p><ul><li>Normalized SG&amp;A is \\(1{,}500-480=1{,}020\\)k, so EBIT is \\(4{,}200-1{,}250-1{,}020-200=1{,}730\\)k. Pro forma tax at 30% leaves \\(1{,}730\\times0.7=1{,}211\\)k. Equivalently, \\(875+480\\times0.7=1{,}211\\)k.</li><li>Adding the 480k pre-tax to the after-tax figure (\\(875+480=1{,}355\\)k) overstates income. D&amp;A stays deducted: operating income here is post-D&amp;A EBIT, not EBITDA. As reported, EBIT is \\(4{,}200-1{,}250-1{,}500-200=1{,}250\\)k, and \\(1{,}250\\times0.7=875\\)k matches the given after-tax amount.</li></ul>
    </div>`,
