const CARDS = [
  {
    id: "eq-m4-ev-ebitda-vs-ev-fcff-capex-2026-11-15",
    topic: "EQ M4 · EV/EBITDA vs EV/FCFF",
    front: `Two firms have the same EV/EBITDA, but Firm A requires much heavier capex than Firm B. Which firm is more expensive, and why? Does EV/FCFF have the same limitation?`,
    back: `<div class="ans">
      <p><strong>Firm A is more expensive.</strong> EV/EBITDA hides differences in capital programs because EBITDA ignores capex (it reflects capex only if D&amp;A ≈ capex). FCFF does <strong>not</strong> have the same blind spot.</p><ul><li>FCFF adds back non-cash D&amp;A but subtracts actual capex (FCInv) and WCInv: \\(\\text{FCFF}=\\text{EBITDA}(1-t)+\\text{Dep}\\times t-\\text{FCInv}-\\text{WCInv}\\).</li><li>So EV/FCFF reveals capital intensity; EV/EBITDA does not. FCFF “directly reflects the amount of the company’s required capital expenditures” and has a stronger link to valuation theory than EBITDA.</li></ul><p><em>Simplified illustration, not a textbook example</em> (taxes and WCInv ignored, so \\(\\text{FCFF}=\\text{EBITDA}-\\text{FCInv}\\)): EV 1,000 and EBITDA 100 for both (EV/EBITDA 10x). Capex 60 for A vs 20 for B → FCFF 40 vs 80 → EV/FCFF 25x vs 12.5x.</p>
    </div>`,
    gap: "Identified A as more expensive but couldn't explain why; thought FCFF has the same blind spot because it adds back D&A."
  },
  {
    id: "eq-m4-justified-trailing-pe-payout-2026-11-15",
    topic: "EQ M4 · Justified trailing P/E",
    front: `The payout ratio is 40%, \\(g\\) is 5% and \\(r\\) is 9%. What is the justified trailing P/E?`,
    back: `<div class="ans">
      <p><strong>10.5.</strong></p><ul><li>Trailing: \\(\\dfrac{P_0}{E_0}=\\dfrac{(1-b)(1+g)}{r-g}=\\dfrac{0.40\\times1.05}{0.04}=10.5\\).</li><li>Leading (forward): \\(\\dfrac{P_0}{E_1}=\\dfrac{1-b}{r-g}=\\dfrac{0.40}{0.04}=10\\).</li></ul><p>\\(b\\) is the retention ratio; the numerator uses the payout, \\(1-b\\). The trailing multiple also includes \\((1+g)\\), because \\(E_1=E_0(1+g)\\).</p>
    </div>`,
    gap: "Used the retention ratio \\(b=0.6\\) instead of the payout \\(1-b=0.4\\), and left out \\((1+g)\\) for the trailing P/E."
  }
];

flashDeck({
