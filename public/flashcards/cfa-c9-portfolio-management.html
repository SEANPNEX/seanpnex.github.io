      <p><strong>Quantifying return in excess of the risk-free rate.</strong> That is the Sharpe ratio: excess return over the risk-free rate per unit of total risk, \\(\\text{SR}_P=\\dfrac{R_P-R_f}{\\sigma_P}\\).</p><ul><li><strong>IR</strong> \\(=\\dfrac{R_A}{\\sigma_A}=\\dfrac{R_P-R_B}{\\sigma(R_P-R_B)}\\): active return per unit of active risk, measured against the benchmark.</li><li>IR <strong>is</strong> used in portfolio construction: \\(\\text{SR}_P^2=\\text{SR}_B^2+\\text{IR}^2\\), with optimal active risk \\(\\sigma_A^*=\\dfrac{\\text{IR}}{\\text{SR}_B}\\sigma_B\\).</li><li>The ex post IR is also used to evaluate past performance.</li></ul>
