  {
    id: "fsa-2026-10-15-a",
    topic: "Equity method · upstream unrealized profit",
    front: "Upstream: SY sells goods costing 600 to BY (20% investor) for 1,000; BY still holds them at year end. How much does BY eliminate from equity income, and when does it come back?",
    back: `<div class="ans">
<ul>
<li>Eliminate only BY's share: 20% × 400 = <strong>80</strong>, not the full 400</li>
<li>Same thing: adjusted NI = SY's NI − 400, then × 20%</li>
<li>Comes back pro rata when BY sells the goods to a third party</li>

    id: "fsa-2026-10-15-b",
    topic: "Equity method · unrealized profit on a fixed asset",
    front: "Upstream: EJ sells goods costing 600 to DJ (20% investor) for 900, and DJ uses them as a fixed asset (10 years, straight line). How does the 300 profit come back, and how much per year?",

<ul>
<li>Through <strong>depreciation</strong>: DJ depreciates 90 vs 60 on cost</li>
<li>Gross 300 / 10 = <strong>30</strong> a year; DJ's share 20% × 30 = <strong>6</strong> a year</li>
<li>2020 income: (1,600 − 300 + 30) × 20% = 266</li>
</ul>
</div>`,

  {
    id: "fsa-equity-vs-fvo-2026-10-16",
    topic: "Equity method vs fair value option",
    front: "A buys 30% of B for 100. B earns NI 80 and pays dividends 20; the stake is worth 112 at year end. Give A's income and carrying amount under the equity method and under the fair value option.",
    back: `<div class="ans">
<ul>
<li><strong>Equity method:</strong> income = 30% × 80 = <strong>24</strong>; carrying amount = 100 + 24 − 6 = <strong>118</strong>. The 6 of dividends is a return of capital: it reduces the investment and is <em>not</em> income.</li>
<li><strong>Fair value option:</strong> income = 6 dividends + 12 FV gain = <strong>18</strong>; carrying amount = <strong>112</strong>.</li>
</ul>
<p>Equity method follows the investee's <strong>earnings</strong>; FVO follows the stake's <strong>market value</strong>.</p>
</div>`,
    gap: "gave 18 as equity-method income by netting dividends against NI; dividends only reduce the carrying amount."
  },
  {
    id: "fsa-nci-presentation-2026-10-16",
    topic: "Consolidation · noncontrolling interest",
    front: "A parent owns 80% of a subsidiary. In the consolidated statements, how much of the subsidiary's assets and liabilities appear, and where do the NCI's share of equity and NI go?",
    back: `<div class="ans">
<ul>
<li>Subsidiary's assets and liabilities: consolidated at <strong>100%</strong>, not 80%</li>
<li><strong>NCI</strong> is shown in <strong>equity</strong>, separately from the parent's equity</li>
<li>Consolidated NI is reported in full, then <strong>split</strong> between the parent and the NCI</li>
</ul>
</div>`,

<ul>
<li><strong>Full goodwill</strong> shows the larger loss: <strong>200</strong> vs <strong>180</strong> under partial goodwill</li>
<li>Consolidated NI is the same under both only <strong>before any impairment</strong>; once goodwill is impaired, NI is lower under full goodwill</li>
<li>Full goodwill also gives higher total assets and equity (the NCI includes its share of goodwill)</li>
</ul>
</div>`,
    gap: "assumed NI is always the same under full and partial goodwill; an impairment is larger under full goodwill (200 vs 180)."
  },
  {
    id: "fsa-equity-income-vs-dividends-2026-10-17",
    topic: "Equity method · income vs dividends",
    front: "An investor holds 30% of an investee that earns NI of 300 and pays dividends of 100. What is the investor's equity-method income, and what do the dividends do?",

<ul>
<li>Income = 30% × 300 = <strong>90</strong>. Dividends play <strong>no</strong> part in income.</li>
<li>Dividends received (30% × 100 = 30) only <strong>reduce the carrying amount</strong> of the investment: +90 − 30 = net <strong>+60</strong></li>
</ul>
</div>`,

    front: "A JV accounted for with the equity method is restated using proportionate consolidation. What happens to NI, equity, revenue, assets and liabilities?",

<ul>
<li><strong>Unchanged:</strong> net income and shareholders' equity</li>
<li><strong>Higher:</strong> revenue, total assets and total liabilities (the venturer's share of each line is added)</li>
<li>Only the presentation changes, so ratios move: net margin and ROA fall and leverage rises</li>
</ul>
</div>`,
    gap: "thought restating the JV changes NI or equity; proportionate consolidation only changes presentation."
  },
  {
    id: "fsa-sbc-market-vs-nonmarket-2026-10-17",
    topic: "Share-based pay · vesting conditions",
    front: "Share-based pay: if a market condition (e.g. a share-price target) is not met, what happens to the expense already recognized? How does that differ for service and non-market performance conditions?",
    back: `<div class="ans">
<ul>
<li><strong>Market condition</strong> missed: the expense <strong>stays recognized</strong> (no reversal) as long as the service is rendered. The condition is already reflected in the grant-date fair value.</li>
<li><strong>Service or non-market performance condition</strong>: the expense is <strong>trued up</strong> to the number of awards expected to vest, and reversed for awards that don't vest</li>
</ul>
</div>`,
    gap: "reversed the expense when a market condition was missed; only service and non-market conditions are trued up."
  },
  {
    id: "fsa-eso-fair-value-drivers-2026-10-17",
    topic: "Share-based pay · option fair value inputs",
    front: "How does the fair value of an employee stock option (and so the compensation expense) respond to a higher risk-free rate, a longer expected term, higher volatility and a higher dividend yield?",

<ul>
<li>Higher <strong>risk-free rate</strong>: fair value <strong>rises</strong></li>
<li>Longer <strong>expected term</strong>: fair value <strong>rises</strong></li>
<li>Higher <strong>volatility</strong>: fair value <strong>rises</strong></li>
<li>Higher <strong>dividend yield</strong>: fair value <strong>falls</strong></li>
</ul>
</div>`,
