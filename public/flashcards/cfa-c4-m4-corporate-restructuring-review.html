    "gap": "Deals done in weak economies created more value on average (BCG: nearly 10% higher three-year return)."
  },
  {
    "id": "ci4-synergies",
    "topic": "Synergies",
    "front": "Distinguish cost and revenue synergies and their sources.",
    "back": "<div class=\"ans\"><ul><li><strong>Cost</strong>: economies of <strong>scale</strong> (one headquarters, capacity utilization, route density, R&amp;D, marketing)</li><li><strong>Revenue</strong>: economies of <strong>scope</strong> (cross-selling, e.g. a bank selling insurance; pricing power from less competition)</li></ul></div>"
  },
  {
    "id": "ci4-investment-types",
    "topic": "Investment types",
    "front": "Compare an equity investment, a joint venture and an acquisition on stake, control and accounting.",
    "back": "<div class=\"ans\"><ul><li><strong>Equity investment</strong>: material stake &lt; 50% in an existing company; no control</li><li><strong>Joint venture</strong>: a <strong>new</strong> company jointly controlled by the partners; shares profit/loss</li><li><strong>Acquisition</strong>: most or all shares; full control; target <strong>consolidated</strong></li></ul></div>",
    "gap": "An equity investment never gives control; acquisitions need much more capital."

    "front": "Why might an issuer sell a segment rather than spin it off, and vice versa?",

  },
  {
    "id": "ci4-restructuring-types",
    "topic": "Restructuring actions",

  },

    "topic": "Comparable company analysis",

  },

    "id": "ci4-transactions",

  },

  },
  {
    "id": "ci4-hofer",
    "topic": "Weighted comparable transactions",

    "gap": "To protect the rating, pay with more stock and less debt-funded cash."
  },
