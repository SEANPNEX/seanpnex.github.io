<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>CFA Ethics — Standard I flashcards</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F0EFEB;--paper:#F0EFEB;--ink:#1C1C1A;--mid:#55554F;
  --muted:#8F8E88;--faint:#C6C5BF;--grid:#DEDDD6;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  -webkit-font-smoothing:antialiased}
body{padding:18px;min-height:100vh}
.wrap{max-width:560px;margin:0 auto}
.figure-head{margin:2px 4px 18px}
.figure-head h1{margin:0 0 5px;font-size:22px;line-height:1.15;letter-spacing:-.035em;font-weight:700}
.figure-head p{margin:0;color:var(--muted);font-size:11.5px;line-height:1.5}
.stage{perspective:1200px;margin-bottom:14px}
.card{
  display:grid;grid-template:1fr / 1fr;
  position:relative;min-height:340px;border-radius:24px;background:var(--paper);
  outline:1px solid var(--grid);cursor:pointer;transform-style:preserve-3d;
  transition:transform .55s cubic-bezier(.165,.84,.44,1);
  -webkit-tap-highlight-color:transparent;user-select:none;
}
.card.is-flipped{transform:rotateY(180deg)}
.face{
  grid-area:1 / 1;
  padding:28px 26px 22px;border-radius:24px;background:var(--paper);
  backface-visibility:hidden;-webkit-backface-visibility:hidden;
  display:flex;flex-direction:column;min-height:340px;min-width:0;
}
.face-back{transform:rotateY(180deg)}
.badge{
  display:inline-flex;align-self:flex-start;margin:0 0 12px;padding:4px 10px;
  border-radius:999px;border:1px solid var(--grid);color:var(--muted);
  font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;
}
.face h2{margin:0 0 10px;font-size:12px;font-weight:600;color:var(--mid);
  letter-spacing:.06em;text-transform:uppercase}
.face-body{flex:1 1 auto;min-height:0;overflow:auto;-webkit-overflow-scrolling:touch}
.face .q,.face .a{margin:0;font-size:17px;line-height:1.5;letter-spacing:-.015em}
.face .a{font-size:15.5px;line-height:1.55}
.face .a strong,.face .q strong{font-weight:700}
.ans p{margin:0 0 10px}
.ans p:last-child{margin-bottom:0}
.ans ul{margin:0 0 10px;padding-left:1.15em}
.ans li{margin:0 0 6px}
.ans li:last-child{margin-bottom:0}
.gap{
  margin-top:14px;padding:12px 14px;border-radius:14px;
  border:1px solid var(--grid);background:transparent;
  color:var(--muted);font-size:12px;line-height:1.5
}
.gap-label{
  display:block;margin-bottom:4px;
  font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);
}
.hint{margin-top:16px;padding-top:4px;color:var(--faint);font-size:11px;letter-spacing:.04em;flex-shrink:0}
.controls{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:4px}
.nav{display:flex;align-items:center;gap:8px}
.btn{
  appearance:none;border:1px solid var(--grid);background:transparent;color:var(--ink);
  border-radius:999px;padding:8px 14px;font:inherit;font-size:12px;font-weight:600;
  cursor:pointer;transition:background .15s ease,border-color .15s ease,opacity .15s ease;
}
.btn:hover:not(:disabled){background:rgba(28,28,26,.04);border-color:var(--faint)}
.btn:disabled{opacity:.35;cursor:default}
.btn.soft{color:var(--muted)}
.btn.mark-miss{border-color:var(--faint)}
.btn.mark-got{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.btn.mark-got:hover:not(:disabled){background:#2a2a27;border-color:#2a2a27}
.index{color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums;min-width:3.5em;text-align:center}
.actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.src{margin-top:16px;color:var(--faint);font-size:9.5px;font-weight:500;letter-spacing:.08em;text-transform:uppercase}
@media(max-width:620px){
  body{padding:12px}
  .card,.face{min-height:360px}
  .face{padding:22px 18px 18px}
  .face .q{font-size:16px}
  .face .a{font-size:14.5px}
  .controls{flex-direction:column;align-items:stretch}
  .nav,.actions{justify-content:space-between}
}
@media(prefers-reduced-motion:reduce){
  .card{transition:none}
}
</style>
</head>
<body>
<div class="wrap">
  <header class="figure-head">
    <h1>Ethics flashcards</h1>
    <p>Quiz misses · Standard I · click the card to flip</p>
  </header>

  <div class="stage">
    <div class="card" id="card" role="button" tabindex="0" aria-live="polite" aria-label="Flashcard — press to flip">
      <div class="face face-front">
        <span class="badge" id="topic-front">I(A)</span>
        <h2>Question</h2>
        <div class="face-body"><div class="q" id="front"></div></div>
        <div class="hint">Click · Space · Enter to flip</div>
      </div>
      <div class="face face-back">
        <span class="badge" id="topic-back">I(A)</span>
        <h2>Answer</h2>
        <div class="face-body">
          <div class="a" id="back"></div>
          <div class="gap" id="gap" hidden></div>
        </div>
        <div class="hint">Click · Space · Enter to flip back</div>
      </div>
    </div>
  </div>

  <div class="controls">
    <div class="nav">
      <button type="button" class="btn" id="prev" aria-label="Previous card">Prev</button>
      <span class="index" id="index">1/1</span>
      <button type="button" class="btn" id="next" aria-label="Next card">Next</button>
    </div>
    <div class="actions">
      <button type="button" class="btn soft mark-miss" id="miss" title="Keep reviewing this one">I still miss this</button>
      <button type="button" class="btn mark-got" id="got" title="Mark as known and advance">Got it</button>
    </div>
  </div>
  <div class="src">Lieflat flash · CFA L2 Ethics · Quiz misses</div>
</div>

<script>
/* Append future quiz misses here. */
const CARDS = [
  {
    id: "ia-stricter-rule-2026-10-12",
    topic: "I(A) Knowledge of the Law",
    front: "When applicable law and the Code &amp; Standards conflict, which do you follow — and what’s the one-line rule?",
    back: `<div class="ans">
<p>Follow the <strong>stricter</strong> of applicable law vs Code &amp; Standards.</p>
<p><em>Know and comply with the stricter requirement; do not knowingly assist in any violation — dissociate if necessary.</em></p>
</div>`,
    gap: "one-line rule / dissociation framing was incomplete — “follow the stricter” alone is not enough."
  },
  {
    id: "ia-ns-ls-ms-2026-10-12",
    topic: "I(A) Knowledge of the Law",
    front: "In a multi-jurisdiction setting, what do NS / LS / MS mean for which rule you follow?",
    back: `<div class="ans">
<ul>
<li><strong>NS</strong> (no applicable securities law) → <strong>Code &amp; Standards</strong></li>
<li><strong>LS</strong> (law less strict than Code) → <strong>Code &amp; Standards</strong></li>
<li><strong>MS</strong> (law more strict than Code) → <strong>the law</strong></li>
</ul>
<p>Always follow the stricter effective rule.</p>
</div>`,
    gap: "named the acronyms but did not map each case to Code vs law (only gestured at MS)."
  },
  {
    id: "ib-ipo-allocations-2026-10-12",
    topic: "I(B) Independence and Objectivity",
    front: "Client gifts vs third-party inducements — what’s allowed, and are personal allocations from oversubscribed IPOs OK?",
    back: `<div class="ans">
<ul>
<li><strong>Third parties</strong> seeking influence: token / ordinary entertainment may be OK; lavish gifts or anything that could compromise judgment → reject.</li>
<li><strong>Clients:</strong> treat gifts as supplementary compensation — disclose to employer (before if possible).</li>
</ul>
<p><strong>Hard ban:</strong> personal allocations from <strong>oversubscribed IPOs</strong> are <strong>not OK</strong>.</p>
</div>`,
    gap: "gift/independence logic was solid; missed the hard ban on personal oversubscribed IPO allocations."
  },
  {
    id: "ib-issuer-paid-research-2026-10-12",
    topic: "I(B) Independence and Objectivity",
    front: "Issuer-paid research — what fee arrangement is acceptable, and what’s the independence trap?",
    back: `<div class="ans">
<p>Acceptable: a <strong>flat fee</strong> not linked to conclusions (full conflict disclosure + true independence still required).</p>
<p><strong>Trap:</strong> pay tied to a favorable opinion, success bonus, warrants/equity kickers, or other pay-to-play structures.</p>
</div>`,
    gap: "answered travel/gifts instead of issuer-paid research; missed flat fee vs conclusion-linked pay."
  }
];

let i = 0;
let flipped = false;

const el = {
  card: document.getElementById("card"),
  front: document.getElementById("front"),
  back: document.getElementById("back"),
  gap: document.getElementById("gap"),
  topicF: document.getElementById("topic-front"),
  topicB: document.getElementById("topic-back"),
  index: document.getElementById("index"),
  prev: document.getElementById("prev"),
  next: document.getElementById("next"),
  miss: document.getElementById("miss"),
  got: document.getElementById("got"),
};

function reportHeight() {
  const h = Math.max(document.body.scrollHeight, document.documentElement.scrollHeight);
  if (parent !== window) parent.postMessage({ chartHeight: h }, location.origin || "*");
}

function render() {
  const c = CARDS[i];
  el.front.innerHTML = c.front;
  el.back.innerHTML = c.back;
  if (c.gap) {
    el.gap.innerHTML = '<span class="gap-label">Gap</span>' + c.gap;
    el.gap.hidden = false;
  } else {
    el.gap.innerHTML = "";
    el.gap.hidden = true;
  }
  el.topicF.textContent = c.topic;
  el.topicB.textContent = c.topic;
  el.index.textContent = (i + 1) + "/" + CARDS.length;
  el.prev.disabled = i === 0;
  el.next.disabled = i >= CARDS.length - 1;
  setFlip(false);
  requestAnimationFrame(reportHeight);
}

function setFlip(on) {
  flipped = on;
  el.card.classList.toggle("is-flipped", on);
  el.card.setAttribute("aria-label", on ? "Answer showing — press to flip" : "Question showing — press to flip");
}

function flip() { setFlip(!flipped); reportHeight(); }
function go(delta) {
  const n = i + delta;
  if (n < 0 || n >= CARDS.length) return;
  i = n;
  render();
}

el.card.addEventListener("click", flip);
el.card.addEventListener("keydown", (e) => {
  if (e.key === " " || e.key === "Enter") { e.preventDefault(); flip(); }
  if (e.key === "ArrowLeft") go(-1);
  if (e.key === "ArrowRight") go(1);
});
el.prev.addEventListener("click", () => go(-1));
el.next.addEventListener("click", () => go(1));
el.miss.addEventListener("click", () => { setFlip(true); reportHeight(); });
el.got.addEventListener("click", () => {
  if (i < CARDS.length - 1) go(1);
  else setFlip(false);
});

window.addEventListener("resize", reportHeight);
render();
requestAnimationFrame(reportHeight);
</script>
</body>
</html>
