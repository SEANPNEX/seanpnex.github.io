const CARDS = [

    "back": "<div class=\"ans\"><ul><li><strong>Dispersed</strong>: many holders, none can control alone (US, UK, Australia, Ireland)</li><li><strong>Concentrated</strong>: an individual or group can exercise control</li><li><strong>Hybrid</strong>: in between (Canada, Germany, Japan, Netherlands, Switzerland)</li></ul><p>Concentrated: <strong>38 of 47</strong> jurisdictions (OECD 2017).</p></div>",

  {
    "id": "ci2-structures",
    "topic": "Control without ownership",
    "front": "How can a group control a company while owning relatively few shares?",
    "back": "<div class=\"ans\"><ul><li><strong>Horizontal</strong> ownership: cross-holdings between companies with mutual interests</li><li><strong>Vertical (pyramid)</strong> ownership: control of holding companies that control operating companies</li><li><strong>Dual-class shares</strong>: superior voting rights for one class</li></ul></div>"
  },
  {
    "id": "ci2-conflicts",
    "topic": "Conflicts by structure",
    "front": "Which conflict dominates under (1) dispersed ownership and voting, (2) concentrated ownership and voting, (3) dispersed ownership with concentrated voting?",

    "gap": "Controlling shareholders mitigate the principal–agent problem but create the principal–principal problem."
  },
  {
    "id": "ci2-influential",
    "topic": "Influential shareholders",
    "front": "Name the main types of influential shareholders and one governance concern for banks, families and SOEs.",
    "back": "<div class=\"ans\"><p>Banks, families, SOEs, institutional investors, group companies, private equity, foreign investors, insiders.</p><ul><li><strong>Banks</strong>: may push large loans on unfavorable terms</li><li><strong>Families</strong>: less principal–agent risk, but poor transparency and weak minority rights</li><li><strong>SOEs</strong>: less market scrutiny; may pursue social policy at shareholders' expense</li></ul></div>"
  },
  {
    "id": "ci2-board-structure",
    "topic": "Board structures",
    "front": "Compare one-tier and two-tier boards.",
    "back": "<div class=\"ans\"><ul><li><strong>One-tier</strong>: a single board of executive and non-executive directors; most common</li><li><strong>Two-tier</strong>: a supervisory board oversees a management board (mandated in e.g. Germany, Argentina, Russia); in Germany it includes stakeholder representatives</li></ul></div>"
  },
  {
    "id": "ci2-independent",
    "topic": "Independent directors",
    "front": "Why do independent directors play a narrower role in concentrated-ownership jurisdictions?",
    "back": "<div class=\"ans\"><p>They originated in dispersed markets to monitor managers. Under concentrated ownership the <strong>principal–agent</strong> problem is less of a concern, and nomination and remuneration committees are often not mandatory.</p></div>",

    "topic": "Codes and stewardship",
    "front": "What do \"comply or explain\" governance codes and stewardship codes require?",
    "back": "<div class=\"ans\"><ul><li><strong>Governance codes</strong>: follow the code or explain why not (Japan: justify having no outside directors)</li><li><strong>Stewardship codes</strong> (mostly voluntary): investors should exercise rights and engage; UK asset managers publish a comply-or-explain statement</li></ul></div>"
  },
  {
    "id": "ci2-board-eval",

  {
    "id": "ci2-tenure",

  },
  {
    "id": "ci2-equity-credit",

    "front": "How does ESG integration differ between equity and credit analysis?",
